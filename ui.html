const numberPresent=x=>x!==''&&x!==null&&x!==undefined&&Number.isFinite(Number(x));
function calculationIssues(c){
 const errors=[];
 if(!numberPresent(c.price)||Number(c.price)<=0)errors.push('Open price must be a finite number greater than zero.');
 if(c.q.length!==6||c.q.some(q=>!numberPresent(q)||q<0||q>100)||Math.abs(c.q.reduce((a,b)=>a+Number(b),0)-100)>1e-8)errors.push('Enter all six rarity probabilities with a total of 100%.');
 c.items.forEach(s=>{const id=s.id||s.name||'New SKU';
  if(!Number.isInteger(s.category)||s.category<0||s.category>=6)errors.push(id+': select a valid category.');
  if(!numberPresent(s.market)||s.market<=0||!numberPresent(s.cost)||s.cost<0)errors.push(id+': enter a market price above zero and a purchase cost of zero or more.');
  if(!numberPresent(s.weight)||s.weight<=0)errors.push(id+': weight must be greater than zero.');
  if(!numberPresent(s.stock)||!Number.isSafeInteger(Number(s.stock))||s.stock<0)errors.push(id+': stock must be a non-negative whole number.');
 });return errors;
}
function economics(c){
 const issues=calculationIssues(c),weights=categories.map((_,r)=>c.items.filter(x=>x.category===r&&x.stock>0&&numberPresent(x.weight)&&x.weight>0).reduce((s,x)=>s+Number(x.weight),0));
 c.q.forEach((q,r)=>{if(q>0&&weights[r]===0)issues.push(categories[r]+': no in-stock SKU with a valid weight.');});
 if(weights.some(w=>!Number.isFinite(w)))issues.push('Category weight total is too large.');
 const valid=issues.length===0;
 const rows=c.items.map(x=>{const p=valid?(x.stock>0&&weights[x.category]>0?Number(c.q[x.category])/100*Number(x.weight)/weights[x.category]:0):null;return{...x,p,contribution:p===null?null:Number(x.cost)*p,ratio:numberPresent(x.market)&&x.market>0&&numberPresent(x.cost)&&x.cost>=0?Number(x.cost)/Number(x.market):null};});
 const cost=valid?rows.reduce((s,x)=>s+x.contribution,0):null;
 return{valid,issues,rows,cost,profit:cost===null?null:Number(c.price)-cost,weights};
}
function boxMediaErrors(c){
 const errors=[];
 for(const [key,label,required] of [['imageUrl','Box image URL',true],['webOpeningVideoUrl','Web opening video URL',false],['appOpeningVideoUrl','App opening video URL',false]]){
  const value=String(c[key]??'').trim();
  if(!value){if(required&&!(c.image&&c.imageUrl===undefined))errors.push('Enter a Box image URL.');continue}
  try{const url=new URL(value);if(url.protocol!=='https:'||!url.hostname)throw Error();}catch{errors.push(label+' must be a valid HTTPS URL.')}
 }
 return errors;
}
function boxValueErrors(c){
 const errors=[];
 for(const [key,label] of [['minValue','Min Value'],['maxValue','Max Value']]){
  const raw=String(c[key]??'').trim();
  if(!/^\d+(?:\.\d{1,2})?$/.test(raw)||!Number.isSafeInteger(Math.round(Number(raw)*100))||Number(raw)>90071992547409)errors.push(label+' is required. Enter a non-negative USD amount with up to 2 decimal places.');
 }
 if(!errors.length&&Number(c.minValue)>Number(c.maxValue))errors.push('Min Value must be less than or equal to Max Value.');
 return errors;
}
function stockAlertErrors(s){
 if(s.stockAlertEnabled!==true)return [];
 const raw=String(s.stockAlertThreshold??'').trim();
 return /^\d+$/.test(raw)&&Number.isSafeInteger(Number(raw))?[]:['Enter a whole number of 0 or more for the stock alert threshold.'];
}
function isStockAlert(s){return s.stockAlertEnabled===true&&!stockAlertErrors(s).length&&Number(s.stock)<=Number(s.stockAlertThreshold)}
function validateConfig(c,publish=false){const errors=publish?[...economics(c).issues]:calculationIssues(c);if(!c.name.trim())errors.unshift('Enter a Box name.');errors.push(...boxValueErrors(c),...boxMediaErrors(c));c.items.forEach(s=>{errors.push(...stockAlertErrors(s).map(e=>(s.id||s.name||'New SKU')+': '+e));if(!s.name.trim()||!s.image)errors.push('Complete the name and image for SKU '+(s.id||s.name||'New SKU')+'.');});return [...new Set(errors)];}
const fingerprint=c=>JSON.stringify({price:c.price,q:c.q,items:c.items.map(x=>[x.id,x.category,x.cost,x.weight,Number(x.stock)])});
function simulate(c,n=100000,random=Math.random){
 if(!Number.isSafeInteger(n)||n<1)throw Error('Simulation draw limit must be a positive integer.');
 const issues=calculationIssues(c);if(issues.length)throw Error(issues.join(' '));
 const snapshot=clone(c),counts=Array(c.items.length).fill(0),depleted=[];
 let e=economics(snapshot),initial=e,totalCost=0,expectedTotal=0,completed=0,distribution=[];
 const rebuild=()=>{let sum=0;distribution=e.rows.flatMap((x,i)=>x.p>0?[{i,end:sum+=x.p}]:[])};
 const stopReason=()=>!e.valid?'category-empty':e.profit<=0?'non-positive-profit':null;
 let reason=stopReason();if(!reason)rebuild();
 while(completed<n&&!reason){
  const u=random();if(!Number.isFinite(u)||u<0||u>=1)throw Error('Invalid random sample.');
  const selected=distribution.find(x=>u<x.end)||distribution[distribution.length-1];
  const item=snapshot.items[selected.i];
  expectedTotal+=e.cost;totalCost+=Number(item.cost);counts[selected.i]++;item.stock=Number(item.stock)-1;completed++;
  if(item.stock===0){
   depleted.push({id:item.id||item.tempId||'',name:item.name,category:item.category,draw:completed});
   e=economics(snapshot);reason=stopReason();if(!reason)rebuild();
  }
 }
 const totalRevenue=completed*Number(c.price),totalProfit=totalRevenue-totalCost;
 return{mode:'dynamic-stock',n:completed,requested:n,price:Number(c.price),totalCost,totalRevenue,totalProfit,
  average:completed?totalCost/completed:null,profit:completed?totalProfit/completed:null,
  expected:initial.cost,initialProfit:initial.profit,expectedAverage:completed?expectedTotal/completed:null,
  difference:completed?(totalCost-expectedTotal)/completed:null,
  finalCost:e.cost,finalProfit:e.profit,finalMargin:e.profit===null?null:e.profit/Number(c.price),
  stopReason:reason||'draw-limit',issues:e.issues,emptyCategories:categories.filter((_,i)=>Number(c.q[i])>0&&e.weights[i]===0),
  depleted,remainingStocks:snapshot.items.map(x=>Number(x.stock)),counts,fingerprint:fingerprint(c)};
}

function skuPriceWarnings(categoryValue,marketValue,stockValue){
 const band=categoryValue!==''&&categoryValue!==null&&categoryValue!==undefined?DEMO_BOX_DATA.find(x=>x.id===box.id)?.bands[Number(categoryValue)]:null;

}

}

 const d=document.createElement('dialog');d.className='dialog sku-price-confirm';d.id='sku-price-confirm';d.setAttribute('aria-labelledby','sku-confirm-title');d.setAttribute('aria-describedby','sku-confirm-message');

 document.body.appendChild(d);
 return new Promise(resolve=>{let settled=false;const finish=accepted=>{if(settled)return;settled=true;if(d.open)d.close();d.remove();if(!accepted&&$('#dialog')?.open)$('#s-market')?.focus();resolve(accepted)};

 });

async function validateImport(){
 if(!importFile)return;
 const token=++importRevision,file=importFile,revision=JSON.stringify(work),boxID=box.id;
 const active=()=>token===importRevision&&$('#dialog').open&&box.id===boxID;
 $('#validate-import').disabled=true;$('#validate-import').textContent='Validating…';
 try{
  if(!/\.xlsx$/i.test(file.name))throw Error('Choose an .xlsx file.');
  if(file.size>5e6)throw Error('This prototype supports files up to 5 MB.');
  const raw=await readWorkbook(file);if(!active())return;
  const rows=normalizeImportRows(raw),head=rows.shift();
  let errors=[],seen=new Set,items=[],added=0,updated=0,unchanged=0;
  for(const row of rows){
   if(!row.some(x=>x!==''&&x!=null))continue;
   const v=h=>{const x=row[head.indexOf(h)]??'';return typeof x==='string'?x.trim():x},id=String(v('SKU ID')).trim(),existing=work.items.find(s=>s.id===id&&id),num=h=>Number(v(h)),rowErrors=[];
   if(id&&(seen.has(id)||!existing))rowErrors.push(seen.has(id)?'Duplicate SKU ID.':'SKU ID does not belong to this Box.');
   if(id)seen.add(id);
   if(typeof v('Product name')==='object'||!String(v('Product name')).trim())rowErrors.push('Product name is required and must be text, not a formula.');
   if(typeof v('Image URL')==='object'||typeof v('SKU ID')==='object')rowErrors.push('SKU ID and Image URL must be values, not formulas.');
   const cat=categories.indexOf(v('Category'));if(cat<0)rowErrors.push('Choose a valid category.');
   for(const h of ['Market price','Purchase cost','Weight'])if(typeof v(h)==='object'||v(h)===''||!Number.isFinite(num(h))||(h==='Purchase cost'?num(h)<0:num(h)<=0))rowErrors.push(h+' is invalid; enter a value, not a formula.');
   const stock=existing?.stock??(v('Available stock')===''?10000:num('Available stock'));
   if(!existing&&(!Number.isSafeInteger(stock)||stock<0))rowErrors.push('Initial stock must be a non-negative integer.');

   if(!rowErrors.length){try{
    if(url.startsWith('local-image:')){const ref=work.items.find(s=>(s.id||s.tempId)===url.slice(12));if(!ref)throw Error('Local image reference cannot be found.');image=ref.image;url=ref.imageUrl||'';}

   const item={id,name:String(v('Product name')).trim(),category:cat,market:num('Market price'),cost:num('Purchase cost'),weight:num('Weight'),stock,drawn:existing?.drawn||0,image,imageUrl:url||existing?.imageUrl||''};

function normalizeImportRows(raw){
 const first=(raw[0]||[]).map(h=>h==='Units drawn'?'Total drawn':h);
 if(headers.every(h=>first.includes(h))){const rows=raw.slice(1);rows.unshift(first);return rows;}
 if(raw.templateVersion!==undefined&&raw.templateVersion!==2)throw Error('Unsupported template version. Download a new template.');
 if(raw.boxId&&raw.boxId!==box.id)throw Error('This workbook belongs to '+raw.boxId+'. Import it into that Box.');

 const metadata=raw.find(r=>r._row===4)?.[0];if(typeof metadata==='string'&&/^Box ID: BX\d+$/.test(metadata)&&metadata.slice(8)!==box.id)throw Error('This workbook belongs to '+metadata.slice(8)+'. Import it into that Box.');
 for(const row of raw){
  if(row._row<11)continue;
  const firstText=typeof row[0]==='string'?row[0].trim():'',cat=categories.findIndex(c=>c.toUpperCase()===firstText.toUpperCase());
  if(cat>=0){
   if(categoryIndex>=0&&!map)throw Error('Missing column headers for '+categories[categoryIndex]+'.');
   if(seen.has(cat))throw Error('Duplicate category section at row '+row._row+': '+categories[cat]+'.');
   seen.add(cat);categoryIndex=cat;map=null;closed=false;continue;
  }
  if(!row.some(x=>!blankCell(x)))continue;
  if(firstText==='Product'&&row[3]==='Pricing'&&row[6]==='Inventory & history'&&row[8]==='Probability & cost')continue;
  if(firstText==='Insert additional product rows above this line.'){closed=true;continue;}
  if(firstText==='SKU ID'){
   if(categoryIndex<0||map)throw Error('Unexpected column header at row '+row._row+'.');
   const normalized=row.map(cleanHeader);map=sectionHeaders.map(h=>normalized.indexOf(cleanHeader(h)));
   if(map.some(i=>i<0)||new Set(map).size!==11)throw Error('Column headers are missing or changed in '+categories[categoryIndex]+' at row '+row._row+'.');
   continue;
  }
  if(categoryIndex<0||!map||closed)throw Error('Unexpected content at row '+row._row+'. Keep the six category sections and place products above the insertion line.');
  const v=i=>row[map[i]]??'';
  // Reserved stock and calculated formulas alone do not create a new product.
  if([0,1,2,3,4,8].every(i=>blankCell(v(i)))&&(blankCell(v(6))||Number(v(6))===10000))continue;
  const item=[v(0),v(2),categories[categoryIndex],v(1),v(3),v(4),v(8),v(6),v(7),v(5),v(9),v(10)];item._row=row._row;result.push(item);

}

/* Read-only, deterministic demonstration ledger. Independent of pool configuration.
   One row per purchased Box unit; money is integer USD cents. */
const DashboardModel = (() => {
  const DAY = 86400000;
  const snapshotDay = '2026-10-12';
  const firstDay = '2026-09-01';
  const boxes = [5,20,50,100].map((price,i)=>({id:`BX00${i+1}`,name:`$${price} Box`,priceCents:price*100}));
  const stamp = day => Date.parse(day+'T00:00:00Z');
  const iso = value => new Date(value).toISOString().slice(0,10);
  const shift = (day,n) => iso(stamp(day)+n*DAY);
  const days = (start,end) => Array.from({length:Math.round((stamp(end)-stamp(start))/DAY)+1},(_,i)=>shift(start,i));
  const validDay = day => /^\d{4}-\d{2}-\d{2}$/.test(day)&&Number.isFinite(stamp(day))&&iso(stamp(day))===day;
  function range(preset) {
    const end=snapshotDay;
    return {start:preset==='today'?end:preset==='yesterday'?shift(end,-1):preset==='last7'?shift(end,-6):preset==='last30'?shift(end,-29):preset==='month'?end.slice(0,7)+'-01':firstDay,end:preset==='yesterday'?shift(end,-1):end};
  }
  function validate(filter) {
    if(!validDay(filter.start)||!validDay(filter.end))return 'Choose a valid start and end date.';
    if(filter.start>filter.end)return 'Start date must be on or before end date.';
    if(filter.end>snapshotDay)return 'Choose a date on or before Oct 12, 2026 (demo snapshot).';
    if((stamp(filter.end)-stamp(filter.start))/DAY>=366)return 'Choose a date range of 366 days or less.';
    if(filter.boxId!=='all'&&!boxes.some(b=>b.id===filter.boxId))return 'Choose a valid Box type.';
    return '';
  }
  function split(total,count,index) { return Math.floor(total/count)+(index<total%count?1:0); }
