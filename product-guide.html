仅凭Common或Grail名称判断成本；改完看全Box成本与毛收益。Category类别本身是标签，没有数值高低评价。", "purpose": "说明每个稀有度分配到多少开盒机会，是SKU概率计算的前提，也能解释分类成本为什么高。"}, {"label": "Market price range · 分类市场价参考范围", "kind": "系统读取", "meaning": "原始表格为特定Box和分类列出的商品市场价区间，单位美元，包含上下限；不是进货价范围，也不是开盒售价。", "source": "只读；四个已有Box按Box ID与所选Category读取对应原表资料。选择／切换分类立即更新，编辑已有SKU按当前分类显示。", "calculation": "不从SKU价格或实时行情计算，也不根据当前开盒售价临时套档。没有分类或没有该Box范围资料时不显示；新增同价Box也不自动继承。", "rules": "仅提供录入参考，不自动填价格、不改变分类／权重／概率，超区间时标红；提交时二次确认，可选择继续编辑或仍然应用，不作为硬性拦截。金额显示两位小数。生产需保存Box与来源范围配置的关联；四档示例来自原表。", "reading": "较高区间表示该类奖品的市场参考价档位较高，不代表进货成本或利润更高。区间本身不是优劣评分。", "action": "录入Market price时对照该区间核对奖品分类；显示含上下限。当前需求只展示，不自动阻止范围外输入。新Box没有资料时不猜范围；已有Box改名或改售价不自动切换来源档位。", "purpose": "让运营在选择分类后立即知道该Box预期放什么市场价档位的奖品，减少来回查表和不同Box档位混淆。"}, {"label": "SKU ID · 商品配置编号", "kind": "系统生成", "meaning": "标识当前 Box 中的 SKU 配置，用于编辑、导入匹配及关联库存和抽奖历史。", "source": "首次成功保存草稿或发布时生成稳定 ID，运营不可填写或修改；保存前显示 Assigned on save。", "calculation": "不从商品名称计算；后端生成并保证唯一性，具体编码规则待接口约定。同一商品加入其他 Box 后配置与库存独立。", "rules": "导入空 ID 表示新增；非空 ID 只能匹配当前 Box 中已有 SKU。重复、未知或跨 Box 的 ID 拒绝；移除配置不删除历史关联。", "purpose": "为编辑、导入更新和历史记录提供稳定匹配依据；名称可变，不能承担这个职责。"}, {"label": "Product image URL · 商品图片链接", "kind": "运营填写", "meaning": "新增和编辑SKU仅输入图片URL，不提供本地图片上传。", "source": "先点击Upload image to get URL前往外部网站上传，复制图片直链回填；网站待确定，按钮暂禁用，已有直链可填写。", "calculation": "填写HTTPS图片直链，提交时校验并读取图片；成功后与SKU关联，原型缓存可用图片。", "rules": "必填；空值、非HTTPS或不可读取图片不得提交。加载失败保留其他输入，不回退到上传文件。原演示SKU缺少URL时编辑需补填；Box媒体输入规则见Box media章节。", "purpose": "让运营从商品包装确认款式，并为用户展示奖品；图片处理成功不替代商品身份核对。"}]}, {"title": "价格、权重与库存", "fields": [{"label": "Market price · 市场价", "kind": "运营填写", "meaning": "该商品用于运营对比的市场参考价，单位美元／件。不是平台实际采购成本。", "source": "在 SKU 新增／编辑弹窗或导入文件中填写；列表只读，不自动抓取实时行情。", "calculation": "本字段不计算；修改后重算 Purchase / Market。它不直接改变权重、抽中概率或理论每抽成本。", "rules": "必填、大于零且为有限数值；界面显示两位小数。新增／编辑表单超分类建议范围时标红，提交需二次确认，确认后允许应用；市场价>100美元且库存>50时额外黄字提醒。应用到当前编辑后需保存或发布。正式金额输入与存储精度需接口统一，不能只靠前端显示约束。", "reading": "高表示商品的市场参考价值较高，低表示较低；没有统一的越高越好。市场价不等于平台收入，也不直接进入采购成本计算。", "action": "用于核对奖品定位和进货价是否合理。先确认同款、同版本与同成色的参考价；不能通过抬高市场价让奖池看起来更赚钱。", "purpose": "给奖品的市场参考价值提供背景，并作为采购比的分母；不能单独证明平台盈利。"}, {"label": "Purchase cost · 进货价", "kind": "运营填写", "meaning": "平台获得一件该商品的采购成本，单位美元／件；用于奖池成本核算。", "source": "在 SKU 新增／编辑弹窗或导入文件填写；列表只读。", "calculation": "本字段不自动从市场价推算。修改后重算采购比、该商品成本贡献、整盒成本与毛收益，并使旧模拟结果过期。", "rules": "必填、允许零，不允许负数、空值或非有限数值。样例的“市场价85%”只是造数据假设，不是生产默认值或强制规则。", "reading": "同一商品、同等质量与供货条件下，进货价越低越有利于成本；越高，每次抽中它的采购支出越大。不同奖品不能只按进货价高低判断好坏。", "action": "用于核对采购报价。若这个SKU的概率大于零，降低进货价会降低整盒成本；不要把不准确的低价填入系统来消除亏损提醒。", "purpose": "说明真实采购支出的输入来源；不展示这个值，就难以判断成本贡献高是采购价高还是概率高。"}, {"label": "Purchase / Market · 进货价占市场价比例", "kind": "系统计算", "meaning": "采购成本占市场参考价的百分比，用于比较采购价格，不是毛利率。", "source": "只读；输入来自当前编辑中的 Purchase cost 与 Market price，不能直接填写。", "calculation": "用进货价除以市场价，再转成百分比。例如进货价4美元、市场价5美元，显示80.00%。两项价格变化时立即重算。", "rules": "通常显示两位百分数。价格缺失或非法时显示—；市场价为零不能相除。超过100%允许显示，不自动改权重；导入计算列不采信上传值。", "reading": "市场参考价可信且比较口径相同时，比例越低，采购成本占市场价越少，通常采购空间更大；越高，空间越小。超过100%表示采购价高于填入的市场参考价，不等于整盒必亏。", "action": "用于检查采购性价比和价格录入。比如80%表示市场价每1美元对应采购支出0.80美元，剩下的20%不是开盒毛利率。最终盈利仍看整盒成本与开盒售价。", "purpose": "把不同参考价商品的采购成本转成统一比例，帮助发现报价／录入异常；不是另一种利润指标。"}, {"label": "Weight · 类内权重", "kind": "运营填写", "meaning": "同一分类内商品的相对中奖机会。它不是百分比，也不是库存件数。", "source": "新增／编辑SKU、导入或表格行内填写；允许正小数，无需凑成100。新SKU权重为空，必须填写。", "calculation": "先把同一分类中所有有库存且配置合法商品的权重相加，再用各商品权重计算类内占比。权重输入合法时立即重算概率、成本和收益，旧模拟过期。", "rules": "必须是大于零的有限数值。空值或非法值不按零处理；标错、计算结果显示—，保存／发布校验不通过。行内修改只属于未保存编辑，不立即改变线上权重。", "reading": "同分类其他有效权重不变时，提高本SKU权重会提高其抽中概率（只有它可抽时概率不变），同时压低同类其他SKU的概率。没有越高或越低越好的标准；不同分类的权重不能直接比较。", "action": "用于调节同类奖品的出奖结构。提高比该类当前平均采购成本更便宜商品的权重，会降低该类期望成本；提高更贵商品的权重则会增加成本。修改后看整盒重算结果。同类权重全乘相同倍数，概率不变。", "purpose": "给运营一个可编辑的同类出奖频率控制项；无需手工凑各SKU概率为100%。"}, {"label": "Stock remaining / Available stock / Initial stock · 剩余可抽／初始库存", "kind": "系统读取／新增可填", "meaning": "当前 Box 分配给该 SKU、可用于抽奖的件数，非负整数。", "source": "新增时 Initial stock 默认10,000，可手动修改；已保存 SKU 的 Available stock 来自独立库存台账，在列表独立的Stock remaining列显示，编辑弹窗仍用Available stock且只读。", "calculation": "已有库存用 Adjust stock 调整：Add加上输入数量，Remove减去输入数量；真实完成抽奖由库存服务扣减。库存为零时退出计算，补货后按原权重恢复。", "rules": "新增／编辑SKU中，市场价>100美元且库存>50时额外显示黄色风险文字，提醒复核采购成本与抽中概率，不阻止提交；100美元或50件的边界不触发。已有库存调整确认后立即生效，不等待发布，也不随取消配置或修改配置回滚。导入只接受新SKU的初始库存；现有库存不回写。并发扣减、防重和锁由后端实现。", "reading": "高表示可分配出奖件数更多，低表示更接近缺货，不代表概率更高或利润更好。当前库存数量不参与权重加权；从120变150不会改变概率，从正数变零才会退出抽取。", "action": "用于补货和核对可履约数量，不能为了好看虚填库存。归零或恢复库存会触发同类重分配，之后应重新检查整盒成本；低价商品售罄有可能提高剩余奖池成本。没有新增固定低库存报警阈值。 页面分为剩余可抽和累计抽出两列，库存台账与抽奖计数各自独立。剩余可抽加累计抽出不代表初始库存，补货和人工减少都会使两者不同。", "purpose": "解释哪些SKU当前能够被抽到，也帮助识别库存归零导致的概率及成本变化。"}, {"label": "Stock alert · 库存告警开关", "kind": "运营填写", "meaning": "是否为当前Box的当前SKU启用按剩余数量判断的库存告警。", "source": "新增默认Off；旧数据无字段按Off处理，编辑读取stockAlertEnabled。", "calculation": "Off不判断告警且隐藏阈值；On显示必填阈值，不预填任何数字。", "rules": "Apply changes仅应用当前编辑；Save draft保存草稿；Publish后成为已发布规则。取消弹窗不修改配置。关闭并应用时清空已保存阈值，不影响库存、概率、收益或模拟。", "purpose": "让运营按需为单个奖品启用告警，避免默认全量开启。"}, {"label": "Alert threshold (units) · 库存告警阈值", "kind": "运营填写", "meaning": "剩余可抽库存达到此数量或更少时提示，单位件；不是百分比或累计抽出数量。", "source": "仅On时必填stockAlertThreshold；由运营输入，无默认值。", "calculation": "启用且Stock remaining≤阈值时显示Low stock；补货至大于阈值后清除。0合法，表示库存耗尽时告警；阈值可高于当前库存，应用后立即显示当前配置预览。", "rules": "必须为0至9,007,199,254,740,991的整数；空值、小数、负数、非数值不通过。无效时禁用提交，非法非空输入显示Enter a whole number of 0 or more for the stock alert threshold. 保存／发布再次校验。", "purpose": "用明确剩余件数提醒补货，阈值由运营按奖品单独决定。"}]}], "stock": [{"title": "库存操作字段", "fields": [{"label": "Stock remaining / Available stock / Initial stock · 剩余可抽／初始库存", "kind": "系统读取／新增可填", "meaning": "当前 Box 分配给该 SKU、可用于抽奖的件数，非负整数。", "source": "新增时 Initial stock 默认10,000，可手动修改；已保存 SKU 的 Available stock 来自独立库存台账，在列表独立的Stock remaining列显示，编辑弹窗仍用Available stock且只读。", "calculation": "已有库存用 Adjust stock 调整：Add加上输入数量，Remove减去输入数量；真实完成抽奖由库存服务扣减。库存为零时退出计算，补货后按原权重恢复。", "rules": "新增／编辑SKU中，市场价>100美元且库存>50时额外显示黄色风险文字，提醒复核采购成本与抽中概率，不阻止提交；100美元或50件的边界不触发。已有库存调整确认后立即生效，不等待发布，也不随取消配置或修改配置回滚。导入只接受新SKU的初始库存；现有库存不回写。并发扣减、防重和锁由后端实现。", "reading": "高表示可分配出奖件数更多，低表示更接近缺货，不代表概率更高或利润更好。当前库存数量不参与权重加权；从120变150不会改变概率，从正数变零才会退出抽取。", "action": "用于补货和核对可履约数量，不能为了好看虚填库存。归零或恢复库存会触发同类重分配，之后应重新检查整盒成本；低价商品售罄有可能提高剩余奖池成本。没有新增固定低库存报警阈值。 页面分为剩余可抽和累计抽出两列，库存台账与抽奖计数各自独立。剩余可抽加累计抽出不代表初始库存，补货和人工减少都会使两者不同。", "purpose": "解释哪些SKU当前能够被抽到，也帮助识别库存归零导致的概率及成本变化。"}, {"label": "Quantity to add / remove · 本次调整数量", "kind": "运营填写", "meaning": "本次要增加或减少的件数，不是调整后的库存总数。", "source": "先选Add stock或Remove stock，再填正整数；不输入正负号，初始为空。", "calculation": "Add把数量加到当前库存，Remove从当前库存扣除该数量。", "rules": "数量必须大于零且为整数；Remove不得超过当前库存。确认前只预览，确认后立即提交库存事务，与保存草稿无关。", "reading": "数量越大代表本次增加或减少得更多，不代表经营效果更好；要结合操作方向和当前库存看。", "action": "核对所选Add／Remove及结果库存；比如当前200、Add 30，结果230；Remove 30，结果170。", "purpose": "明确本次操作的增减量，避免把目标库存总量误填成增减量。"}, {"label": "Stock after change · 调整后库存", "kind": "系统计算", "meaning": "本次库存调整若成功，目标SKU将剩余的可抽件数。", "source": "只读；当前库存来自台账，调整方式与数量来自本次输入。", "calculation": "当前库存加上或减去输入数量；同时显示算式帮助核对方向。", "rules": "未填数量时显示—，非法输入不能确认。并发变更时服务端重新校验最新库存，不能把过期预览当成功结果。", "reading": "越高表示调整后可出奖件数更多，不直接提高中奖概率；归零才会退出当前概率计算。", "action": "确认是否符合实际供货和出奖安排，尤其检查是否误减到零；不要为了降低概率而虚改库存，调概率用权重。", "purpose": "在提交前核对调整方向和剩余件数，避免库存一加一减理解反了。"}]}], "cost-breakdown": [{"title": "分类成本表", "fields": [{"label": "Category / Rarity probabilities · 分类与分类概率", "kind": "运营填写／奖池页读取", "meaning": "SKU属于六个稀有度中的哪一类；分类概率表示每次开盒抽中这一类的机会。", "source": "SKU弹窗选择Category，新增不预选。六类概率在Basic information填写；奖池页Category probability只读显示所选分类的配置值。", "calculation": "类别本身不计算。商品按所属分类参与权重求和；分类概率参与最终商品概率计算。改变类别重算原类别与新类别，改变分类概率重算整盒。", "rules": "分类必选。六个概率均须填写、各在0%至100%之间且合计100%，不能把空值当零；当前原型支持0.01%，正式精度待接口统一。没有分类单独上线开关。", "reading": "某分类概率越高，该分类整体越常被抽中；越低则越少。没有哪一类天然应该越高越好。六类合计固定100%，提高一类必须相应降低其他类；从成本较低的类别转向成本较高的类别通常会增加整盒成本。", "action": "用于配置各档奖品的出奖结构。应比较类别内按权重算出的平均进货成本，不能仅凭Common或Grail名称判断成本；改完看全Box成本与毛收益。Category类别本身是标签，没有数值高低评价。", "purpose": "说明每个稀有度分配到多少开盒机会，是SKU概率计算的前提，也能解释分类成本为什么高。"}, {"label": "Cost / draw · 分类每抽成本贡献", "kind": "系统计算", "meaning": "这一分类给整盒每抽平均采购成本带来的金额，单位美元／抽。", "source": "只读；取同一配置中该分类全部SKU的每抽成本贡献。", "calculation": "把该分类每个SKU的进货价乘以整盒抽中概率，再相加；等于分类概率乘以该类按权重计算的平均进货价。", "rules": "显示四位小数，先汇总未舍入值；不是抽中该类一次要支付的条件成本。不能用市场价计算；无效配置不可用。", "reading": "越高，表示这一类占用的整盒平均采购成本更多；不等于该类商品更贵或更差，也可能是分类概率高。越低则占用金额较少。", "action": "用于决定先检查哪个分类。把该类概率与类内商品进货价、权重一起看，不能直接要求每个类别成本都越低越好。", "purpose": "先定位哪个分类占用更多整盒平均成本，再进入该分类找具体SKU，减少逐行排查。"}, {"label": "Share of cost · 分类成本占比", "kind": "系统计算", "meaning": "整盒预计采购成本中，由这个分类承担的比例。它是成本结构，不是该分类中奖概率，也不是利润率。", "source": "只读；读取分类每抽成本贡献及整盒理论每抽成本。", "calculation": "分类每抽成本贡献除以整盒理论每抽成本，再转成百分比。例如类别贡献4美元、整盒成本20美元，占比20%。", "rules": "整盒理论成本为零时显示—，包括Total行占比；不是0%或100%。按原始值计算，各行四舍五入后的显示合计可能不是100%。", "reading": "越高说明整盒预计成本越集中在该分类，越低说明份额较小；没有统一的好坏阈值。占比会受到其他分类成本变化影响，即使本类金额不变，占比也可能升高。", "action": "与分类成本金额一起看。例：本类成本2美元、全盒10美元，占20%；其他类变便宜使全盒降到8美元，本类仍2美元但占25%，不代表本类成本增加。", "purpose": "把分类成本换成占整盒成本的份额，便于看成本集中在哪里；与Probability并排可区分出奖机会和成本份额。"}, {"label": "Total · 整盒汇总", "kind": "系统计算", "meaning": "这一行核对六分类汇总：概率、每抽成本和成本占比。", "source": "只读；与上方六分类使用同一配置、同一库存时点和相同未舍入数据。", "calculation": "概率为六类概率之和；成本为六类贡献之和；有效且总成本大于零时成本占比为100%。", "rules": "概率必须100%且各输入合法；成本为零时占比显示—。不能把占比100%误解为收入全部用于采购。", "reading": "概率合计只能是100%，不是越高越好；总成本越高，同售价下毛收益空间越小。占比合计100%仅指全部采购成本份额，不是售价占比。", "action": "总成本先对照售价，再用分类表和前三SKU定位来源。单项显示值有舍入差异时，以未舍入汇总结果为准。", "purpose": "提供与主页面Expected cost / draw一致的汇总，确认弹窗没有只算当前分类或漏掉商品。"}]}, {"title": "最高成本来源", "fields": [{"label": "Top 3 cost contributors · 成本贡献最高的SKU", "kind": "系统排序", "meaning": "当前整盒中，每抽成本贡献金额最高的最多三个SKU。每个条目显示名称、分类、SKU ID及进货价、整盒概率和贡献金额。", "source": "只读；覆盖六类全部有效SKU，不受搜索、分页和当前Tab影响。", "calculation": "按进货价乘以整盒抽中概率得到的未舍入贡献金额降序排序，取前三个正贡献SKU；同值按当前数据顺序显示，不暗示差异。", "rules": "不足三个按实际数量显示，不填凑；全部贡献为零显示空提示。Top 3不是预算阈值、最大可能赔付、最高单价排名或相对上次的成本涨幅；数据变更后重新打开时重算。", "reading": "排名越靠前，只表示当前贡献金额更大，不是近期涨幅更大，也不表示应该移除。单价便宜但高频出奖的SKU完全可能排在高价稀有SKU前面。", "action": "按当前成本暴露挑选先核对的对象：看进货价是否准确、概率是否符合奖品策略，再调权重。低排名SKU以后也可能因涨价、加权或其他商品缺货而进入前三；每次改完需重新评估整盒。", "purpose": "先给运营最多三个优先排查对象，缩短首次查看时的扫描范围；三个是展示数量，不是只有三件商品会影响成本。分类入口仍可查看全部SKU。"}, {"label": "Purchase cost · 进货价", "kind": "运营填写", "meaning": "平台获得一件该商品的采购成本，单位美元／件；用于奖池成本核算。", "source": "在 SKU 新增／编辑弹窗或导入文件填写；列表只读。", "calculation": "本字段不自动从市场价推算。修改后重算采购比、该商品成本贡献、整盒成本与毛收益，并使旧模拟结果过期。", "rules": "必填、允许零，不允许负数、空值或非有限数值。样例的“市场价85%”只是造数据假设，不是生产默认值或强制规则。", "reading": "同一商品、同等质量与供货条件下，进货价越低越有利于成本；越高，每次抽中它的采购支出越大。不同奖品不能只按进货价高低判断好坏。", "action": "用于核对采购报价。若这个SKU的概率大于零，降低进货价会降低整盒成本；不要把不准确的低价填入系统来消除亏损提醒。", "purpose": "说明真实采购支出的输入来源；不展示这个值，就难以判断成本贡献高是采购价高还是概率高。"}, {"label": "Draw probability · 整盒抽中概率", "kind": "系统计算", "meaning": "每次开启这个 Box 时抽中该 SKU 的概率，用于实际抽奖、成本计算和模拟。", "source": "只读；读取当前分类概率、该商品权重、同分类所有有效商品权重与库存。", "calculation": "该商品权重除以同分类有库存商品的权重总和，再乘以分类概率。例如分类20%、商品权重1、类内总权重4，整盒抽中概率为5%。", "rules": "库存为零则概率为零；原概率按剩余权重在同分类重分配，分类总概率不变。补货恢复参与。搜索、排序、分页不影响分母。正概率分类无可抽SKU时整盒结果不可用，阻止模拟／发布；不跨分类分摊。极小非零概率增加显示精度。", "reading": "高表示这个SKU更常被抽中，低表示更少被抽中；不直接表示好坏或盈利。概率为零表示当前不会抽中，不等于商品没有价值。", "action": "用于确认运营想要的出奖频率。概率10%表示长期平均约每100抽出现10次，不保证每100抽恰好10次。结合进货价看成本贡献；调权重会同时改变同类其他SKU，不能只看这一行。", "purpose": "把不直观的权重转成真实整盒中奖机会，便于核对出奖频率，也作为采购成本计算输入。"}, {"label": "Cost / draw · 商品每抽成本贡献", "kind": "系统计算", "meaning": "该 SKU 给整个 Box 每抽平均采购成本带来的金额，单位美元／抽。用于找出主要成本来源。", "source": "只读；读取该商品进货价及整盒抽中概率，不接受手工输入或导入覆盖。", "calculation": "用进货价乘以整盒抽中概率。例如进货价4美元、概率5%，成本贡献为每抽0.2000美元。价格或概率改变时重算。", "rules": "显示四位小数。合法零概率贡献为零；配置非法时显示—。不乘库存件数、不用市场价代替进货价，也不代表该商品的利润。", "reading": "越高，表示这个SKU在整盒每抽平均采购成本中占的金额越大，是更主要的成本来源；越低，金额越小。它是成本贡献，不是利润贡献；高不等于坏，低不等于好。高值可能来自采购价高、抽中概率高，或两者共同作用。", "action": "用于按成本影响排序排查。先核对进货价，再看该奖品是否值得安排当前出奖频率。不能直接判定应移除：降权或移除后，概率会转给同类其他商品，整盒成本可能下降也可能上升。修改后以整盒理论成本与毛收益为准。", "purpose": "把进货价和概率合成同口径的美元／抽，比较每个SKU实际占用的平均成本；只看商品单价会漏掉便宜但常出的商品。"}]}], "stock-impact": [{"title": "库存操作字段", "fields": [{"label": "Stock remaining / Available stock / Initial stock · 剩余可抽／初始库存", "kind": "系统读取／新增可填", "meaning": "当前 Box 分配给该 SKU、可用于抽奖的件数，非负整数。", "source": "新增时 Initial stock 默认10,000，可手动修改；已保存 SKU 的 Available stock 来自独立库存台账，在列表独立的Stock remaining列显示，编辑弹窗仍用Available stock且只读。", "calculation": "已有库存用 Adjust stock 调整：Add加上输入数量，Remove减去输入数量；真实完成抽奖由库存服务扣减。库存为零时退出计算，补货后按原权重恢复。", "rules": "新增／编辑SKU中，市场价>100美元且库存>50时额外显示黄色风险文字，提醒复核采购成本与抽中概率，不阻止提交；100美元或50件的边界不触发。已有库存调整确认后立即生效，不等待发布，也不随取消配置或修改配置回滚。导入只接受新SKU的初始库存；现有库存不回写。并发扣减、防重和锁由后端实现。", "reading": "高表示可分配出奖件数更多，低表示更接近缺货，不代表概率更高或利润更好。当前库存数量不参与权重加权；从120变150不会改变概率，从正数变零才会退出抽取。", "action": "用于补货和核对可履约数量，不能为了好看虚填库存。归零或恢复库存会触发同类重分配，之后应重新检查整盒成本；低价商品售罄有可能提高剩余奖池成本。没有新增固定低库存报警阈值。 页面分为剩余可抽和累计抽出两列，库存台账与抽奖计数各自独立。剩余可抽加累计抽出不代表初始库存，补货和人工减少都会使两者不同。", "purpose": "解释哪些SKU当前能够被抽到，也帮助识别库存归零导致的概率及成本变化。"}, {"label": "Quantity to add / remove · 本次调整数量", "kind": "运营填写", "meaning": "本次要增加或减少的件数，不是调整后的库存总数。", "source": "先选Add stock或Remove stock，再填正整数；不输入正负号，初始为空。", "calculation": "Add把数量加到当前库存，Remove从当前库存扣除该数量。", "rules": "数量必须大于零且为整数；Remove不得超过当前库存。确认前只预览，确认后立即提交库存事务，与保存草稿无关。", "reading": "数量越大代表本次增加或减少得更多，不代表经营效果更好；要结合操作方向和当前库存看。", "action": "核对所选Add／Remove及结果库存；比如当前200、Add 30，结果230；Remove 30，结果170。", "purpose": "明确本次操作的增减量，避免把目标库存总量误填成增减量。"}, {"label": "Stock after change · 调整后库存", "kind": "系统计算", "meaning": "本次库存调整若成功，目标SKU将剩余的可抽件数。", "source": "只读；当前库存来自台账，调整方式与数量来自本次输入。", "calculation": "当前库存加上或减去输入数量；同时显示算式帮助核对方向。", "rules": "未填数量时显示—，非法输入不能确认。并发变更时服务端重新校验最新库存，不能把过期预览当成功结果。", "reading": "越高表示调整后可出奖件数更多，不直接提高中奖概率；归零才会退出当前概率计算。", "action": "确认是否符合实际供货和出奖安排，尤其检查是否误减到零；不要为了降低概率而虚改库存，调概率用权重。", "purpose": "在提交前核对调整方向和剩余件数，避免库存一加一减理解反了。"}]}, {"title": "库存变化对成本的影响", "fields": [{"label": "Expected gross profit / draw · 库存变更前后毛收益", "kind": "系统计算", "meaning": "对照库存操作前与操作后，整盒预计每抽毛收益是否变化，单位美元／抽。", "source": "只在库存跨越零、影响可抽集合时展示。在线奖池里的SKU使用已发布配置与最新库存；其他情况显示当前配置影响。", "calculation": "在售价与配置不变的前提下，分别计算操作前后可抽集合的成本；售价分别减去这两个成本，显示前值→后值。", "rules": "不是只减去缺货SKU的成本贡献，必须重算同类概率。前后任一状态无效对应值显示—；全部缺货时提示配置不可抽，不伪造收益。确认前未生效。", "reading": "前后售价相同时，后值降低表示概率重分配后预计成本变高，后值升高表示预计成本变低。后值为负表示预计毛亏损；不能只凭减少库存就认定省成本。", "action": "用它判断是否要补货或先调整配置。便宜SKU缺货可能让更贵的SKU承接概率；若线上配置与草稿不同，应以线上预览为准而不是草稿收益。", "purpose": "在立即生效的库存操作前提示概率重分配可能带来的成本变化，特别是便宜SKU售罄后成本可能升高。"}]}], "loss-publish": [{"title": "确认时的成本与收益", "fields": [{"label": "Open price · 开盒售价", "kind": "运营填写／本页读取", "meaning": "用户开一次 Box 的标价，单位美元／抽，用于计算预计毛收益。", "source": "在 Basic information 填写；奖池页只读，显示当前编辑中的价格。", "calculation": "本字段不计算；修改售价只重算毛收益并使旧模拟过期，不改变抽中概率和采购成本。", "rules": "新建Box为空；必填、大于零且为有限数值。显示两位小数。保存草稿不影响线上售价，发布后才更新已发布配置；它不是扣除优惠后的实际实收。", "reading": "奖池成本不变时，售价越高，每抽理论毛收益越高；但售价提高可能影响用户接受程度与购买量，不能因此认定总收益更高。越低则成本覆盖空间越小。", "action": "用于与整盒理论成本比较。定价还要结合奖品吸引力和用户接受程度；本模型不估算需求变化，不自动给出最优售价。", "purpose": "提供收入侧比较基准，只有成本没有售价，无法判断采购成本是否被覆盖。"}, {"label": "Expected cost / draw · 理论每抽成本", "kind": "系统计算", "meaning": "整个 Box 长期平均每抽的预计采购成本，单位美元／抽，用于判断奖品成本。", "source": "只读；汇总整个 Box 六类中的全部商品，不能只计算当前分类或当前页。", "calculation": "逐个计算商品进货价乘以整盒抽中概率，再把全部商品的成本贡献相加。权重、分类概率、进货价、增删或改类，以及库存跨越零时重算；不需要先运行模拟。", "rules": "显示两位小数，汇总使用未舍入值。任一正概率分类无有效商品或计算字段非法时显示—，不把缺失成本当零。点击可查看成本来源。", "reading": "同一售价下，理论成本越低，预计采购支出越少、毛收益空间越大；越高则空间越小。但一味压低成本可能改变奖品体验，不是越低越好。低于售价表示标价可覆盖预计奖品采购成本；等于售价表示只在采购口径持平；高于售价表示预计毛亏损。", "action": "这是判断当前奖池成本的主要指标，不必先运行模拟。先与开盒售价比较，成本偏高再展开各SKU成本贡献，调整后重新看整盒结果。它不是某一抽的实际成本，也不包含全部经营费用。", "purpose": "汇总整盒长期平均奖品采购支出，是判断配置成本的主指标；不会因只看某分类或某次随机模拟而改变。"}, {"label": "Expected loss · 预计每抽亏损金额", "kind": "系统计算", "meaning": "预计奖品采购成本超过开盒售价的金额，美元／抽，以正数展示亏损大小。", "source": "只读；用于亏损发布／上线确认，与所提交配置的售价和理论成本一致。", "calculation": "仅当理论成本大于售价时，用理论成本减去售价。例如售价20美元、成本22美元，提醒Expected loss: $2.00 per draw。", "rules": "这与主页面毛收益−2美元是同一情况的两种表达，不是两笔费用；零／正毛收益不显示亏损提醒。无效配置先阻止发布。", "reading": "金额越大表示每抽预计亏得越多；是亏损幅度的正数，不是正利润。", "action": "提醒运营核对成本与售价、补货或修改配置。旧版原型允许在提醒后继续，正式售卖以新增红字规则为准：整盒理论每抽毛收益必须大于零，且所有正概率分类均可抽。", "purpose": "在实际发布／上线确认处再次明确预计每抽亏多少，避免只在主页面看到红字而确认时遗漏。"}]}], "invalid-weight": [{"title": "输入与重算", "fields": [{"label": "Weight · 类内权重", "kind": "运营填写", "meaning": "同一分类内商品的相对中奖机会。它不是百分比，也不是库存件数。", "source": "新增／编辑SKU、导入或表格行内填写；允许正小数，无需凑成100。新SKU权重为空，必须填写。", "calculation": "先把同一分类中所有有库存且配置合法商品的权重相加，再用各商品权重计算类内占比。权重输入合法时立即重算概率、成本和收益，旧模拟过期。", "rules": "必须是大于零的有限数值。空值或非法值不按零处理；标错、计算结果显示—，保存／发布校验不通过。行内修改只属于未保存编辑，不立即改变线上权重。", "reading": "同分类其他有效权重不变时，提高本SKU权重会提高其抽中概率（只有它可抽时概率不变），同时压低同类其他SKU的概率。没有越高或越低越好的标准；不同分类的权重不能直接比较。", "action": "用于调节同类奖品的出奖结构。提高比该类当前平均采购成本更便宜商品的权重，会降低该类期望成本；提高更贵商品的权重则会增加成本。修改后看整盒重算结果。同类权重全乘相同倍数，概率不变。", "purpose": "给运营一个可编辑的同类出奖频率控制项；无需手工凑各SKU概率为100%。"}, {"label": "Draw probability · 整盒抽中概率", "kind": "系统计算", "meaning": "每次开启这个 Box 时抽中该 SKU 的概率，用于实际抽奖、成本计算和模拟。", "source": "只读；读取当前分类概率、该商品权重、同分类所有有效商品权重与库存。", "calculation": "该商品权重除以同分类有库存商品的权重总和，再乘以分类概率。例如分类20%、商品权重1、类内总权重4，整盒抽中概率为5%。", "rules": "库存为零则概率为零；原概率按剩余权重在同分类重分配，分类总概率不变。补货恢复参与。搜索、排序、分页不影响分母。正概率分类无可抽SKU时整盒结果不可用，阻止模拟／发布；不跨分类分摊。极小非零概率增加显示精度。", "reading": "高表示这个SKU更常被抽中，低表示更少被抽中；不直接表示好坏或盈利。概率为零表示当前不会抽中，不等于商品没有价值。", "action": "用于确认运营想要的出奖频率。概率10%表示长期平均约每100抽出现10次，不保证每100抽恰好10次。结合进货价看成本贡献；调权重会同时改变同类其他SKU，不能只看这一行。", "purpose": "把不直观的权重转成真实整盒中奖机会，便于核对出奖频率，也作为采购成本计算输入。"}, {"label": "Cost / draw · 商品每抽成本贡献", "kind": "系统计算", "meaning": "该 SKU 给整个 Box 每抽平均采购成本带来的金额，单位美元／抽。用于找出主要成本来源。", "source": "只读；读取该商品进货价及整盒抽中概率，不接受手工输入或导入覆盖。", "calculation": "用进货价乘以整盒抽中概率。例如进货价4美元、概率5%，成本贡献为每抽0.2000美元。价格或概率改变时重算。", "rules": "显示四位小数。合法零概率贡献为零；配置非法时显示—。不乘库存件数、不用市场价代替进货价，也不代表该商品的利润。", "reading": "越高，表示这个SKU在整盒每抽平均采购成本中占的金额越大，是更主要的成本来源；越低，金额越小。它是成本贡献，不是利润贡献；高不等于坏，低不等于好。高值可能来自采购价高、抽中概率高，或两者共同作用。", "action": "用于按成本影响排序排查。先核对进货价，再看该奖品是否值得安排当前出奖频率。不能直接判定应移除：降权或移除后，概率会转给同类其他商品，整盒成本可能下降也可能上升。修改后以整盒理论成本与毛收益为准。", "purpose": "把进货价和概率合成同口径的美元／抽，比较每个SKU实际占用的平均成本；只看商品单价会漏掉便宜但常出的商品。"}]}], "import-ready": [{"title": "导入的影响范围", "fields": [{"label": "Added / Updated / Unchanged · 导入结果数量", "kind": "系统统计", "meaning": "本次文件有效商品行中，预计新增、更新和未变化的记录数，不是库存件数。", "source": "只读；来自表格校验后的行与当前Box编辑数据对比。", "calculation": "空SKU ID归为新增；匹配本Box ID且有效可编辑配置有差异归为更新；匹配且无差异归为未变化。未出现在文件的记录保留，不计入这三项。", "rules": "忽略不回写的现有库存、累计抽出和计算列差异。重复／未知ID等错误必须先解决；Apply才应用当前编辑，不因显示数量而保存或发布。", "reading": "新增或更新越多只表示修改范围更大，不表示导入更好；未变化多也不代表导入失败。", "action": "与本次预期改动数量对照，不符时取消并检查表格ID和内容，再决定是否应用。", "purpose": "在应用文件前核对将新增或覆盖多少记录，发现误把已有SKU留空ID导致的大量新增。"}]}]};const dashboard="<div class=\"dashboard-guide\"><h2>数据看板 · 产品说明</h2><p>2026-10-12 · 英文交互界面 / 中文开发规则 · <a href=\"ui.html\" target=\"_blank\">打开 Dashboard ↗</a></p>\n<p><strong>本轮已确认：</strong>寄出在用户成功提交寄出申请时计入，不等仓库发货；英文统一使用 <b>Shipping requested</b>。待处理奖品为已开出、未选择回收或寄出；待开盒子为已买未开。布局：筛选 → 期间活动和期末待处理 → 已归属利润 → 未归属收入与两类状态 → 四类盒子明细。不增加待办、待发货、超时或待退款模块。</p>\n<details class=\"field-group\"><summary>查看英文界面截图</summary><figure style=\"margin:20px 0\"><a href=\"screens/dashboard-1600.png\" target=\"_blank\"><img style=\"width:100%;border:1px solid #e5e7eb\" src=\"screens/dashboard-1600.png\" alt=\"英文数据看板实际运行截图\"></a><figcaption>实现页面截图，可点击放大。演示值不是实际经营数据。</figcaption></figure></details>\n<section><h3>未归属展示</h3><h4>功能说明</h4><p>在已归属利润下方展示未归属总收入、总盒数及两种未处理状态。</p><h4>交互逻辑</h4><p>按结束日还原状态，关联原始支付金额；开盒仅在两个子类间转移，回收完成或成功寄出申请后才移出未归属。全部或单盒筛选同步更新明细。</p><h4>异常状态</h4><p>缺实付金额显示—；无未处理记录显示0。未知最终成本不计算未归属利润，不与奖品市场价混算。</p></section>\n<section><h3>已归属利润</h3><h4>功能说明</h4><p>展示已确定处置结果的收入、成本、利润，并支持四盒拆分。</p><h4>交互逻辑</h4><p>按处置成功日关联原始支付，收入与成本使用同一批盒子；日期或盒子变化时整块和表格同步更新。</p><h4>异常状态</h4><p>未归属不计入，缺成本显示—；负利润如实显示。生产撤销处置、退款及多奖品分摊规则待确认。</p></section>\n<section><h3>日期与盒子筛选</h3><h4>功能说明</h4><p>提供快捷日期、自定义日期、单盒/全部盒子查询。</p><h4>交互逻辑</h4><p>日期草稿和已应用结果分开；Apply校验后整页同步更新。快捷日期和Box选择立即查询。同页切换导航保留已应用筛选，刷新回默认；日期草稿离开页面时不保存。</p><h4>异常状态</h4><p>无效日期、未来日期、倒序、超过366天保留旧结果并提示。生产请求时应显示加载状态并禁止重复提交；旧响应不能覆盖新条件。原型本地同步计算，不伪造网络加载。</p></section>\n<section><h3>汇总与盒子明细</h3><h4>功能说明</h4><p>六个数字主指标，保留用户确认的五类业务数据并新增实付销售额。</p><h4>交互逻辑</h4><p>汇总与明细使用同一筛选结果；销售、回收、寄出为期间事件，期末两项为截至结束日存量。寄出按申请成功即计入，并同步从待处理奖品移除。</p><h4>异常状态</h4><p>期间无活动显示零值和说明，但不抹掉期末历史存量。缺价金额显示—而数量保留。生产失败显示错误和Retry，保留筛选条件；不能把错误绘制成全零。</p></section>\n<section><h3>寄出申请事件</h3><h4>功能说明</h4><p>将用户说的“点击寄出就算”落实为成功提交的持久化业务事件。</p><h4>交互逻辑</h4><p>确认寄出→服务端事务写入申请和奖品明细→成功返回→计入Shipping requested并移出Pending prizes。批量按奖品件数；同实例首次成功事件幂等去重。申请发货状态后续变化不重复增加。</p><h4>异常状态</h4><p>弹窗取消、地址不完整、库存校验失败或未成功落库不计。请求超时结果未知应按request_id查结果后刷新，不能仅凭前端按钮点击累加。取消已成功申请与重新申请的冲回口径待确认。</p></section>\n<h3>逐参数定义</h3><p>下面30项覆盖所有可见筛选、汇总、表格列与显示参数；同一指标在汇总与表格复用同一公式。</p>\n<details open class=\"field-group\"><summary>筛选与时间参数</summary>\n<section class=\"field-definition\"><h4>Date range / Start date / End date</h4><dl>\n<div><dt>是什么</dt><dd>本次活动统计的起止自然日，含首日及末日。待处理只使用结束日期。</dd></div>\n<div><dt>数据来源</dt><dd>运营选择日期；默认 Last 7 days。</dd></div>\n<div><dt>怎么算</dt><dd>设开始日 S、结束日 E；活动时间区间为 [S 00:00:00, E次日00:00:00)。N=E−S+1 个自然日。</dd></div>\n<div><dt>规则／异常</dt><dd>开始不可晚于结束；必须是真实有效日期；演示结束不可超过2026-10-12，单次最多366天。生产时区须由服务端统一，不能随浏览器位置变化。</dd></div>\n<div><dt>为什么展示</dt><dd>明确哪些业务事件进入本期，避免把期间发生量与期末存量混算。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>Today / Yesterday</h4><dl>\n<div><dt>是什么</dt><dd>今天或昨天一个自然日。</dd></div>\n<div><dt>数据来源</dt><dd>报表统一时区下的当前日期；演示使用固定日期2026-10-12。</dd></div>\n<div><dt>怎么算</dt><dd>Today: [今天,今天]；Yesterday: [昨天,昨天]。</dd></div>\n<div><dt>规则／异常</dt><dd>快捷项立即生效。演示使用完整日快照；生产今天尚未结束时应标注截止时刻。生产实时截点暂未接入。</dd></div>\n<div><dt>为什么展示</dt><dd>快速检查单日变化。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>Last 7 days / Last 30 days</h4><dl>\n<div><dt>是什么</dt><dd>截至今天的连续7或30个自然日，包含今天。</dd></div>\n<div><dt>数据来源</dt><dd>统一报表日期。</dd></div>\n<div><dt>怎么算</dt><dd>Last 7 days: [今天−6,今天]；Last 30 days: [今天−29,今天]。</dd></div>\n<div><dt>规则／异常</dt><dd>原型默认2026-10-06至2026-10-12。切换时所有指标和表格一起更新。</dd></div>\n<div><dt>为什么展示</dt><dd>支持近期运营观察。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>This month</h4><dl>\n<div><dt>是什么</dt><dd>当月1日至今天。</dd></div>\n<div><dt>数据来源</dt><dd>报表日所在月份。</dd></div>\n<div><dt>怎么算</dt><dd>S=本月1日，E=今天。</dd></div>\n<div><dt>规则／异常</dt><dd>仅统计当前所选区间，不展示环比或趋势。</dd></div>\n<div><dt>为什么展示</dt><dd>观察本月至今规模，不混用自然月环比。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>All time</h4><dl>\n<div><dt>是什么</dt><dd>全部可用历史。</dd></div>\n<div><dt>数据来源</dt><dd>服务端业务历史起点；演示起点2026-09-01。</dd></div>\n<div><dt>怎么算</dt><dd>S=历史起点，E=报表截止日期。</dd></div>\n<div><dt>规则／异常</dt><dd>不展示周期对比。演示最长42天，生产历史超过366天的聚合方案待接口确定。</dd></div>\n<div><dt>为什么展示</dt><dd>查看累计业务规模。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>Apply / Custom date range</h4><dl>\n<div><dt>是什么</dt><dd>应用手动编辑的起止日期。</dd></div>\n<div><dt>数据来源</dt><dd>表单临时选择 dashboardDraft 与已应用 dashboardFilter 分开。</dd></div>\n<div><dt>怎么算</dt><dd>点击 Apply 且校验通过，原子替换当前查询条件，再重算整页。</dd></div>\n<div><dt>规则／异常</dt><dd>编辑日期时旧结果仍保留，提示 Date changes are not applied；非法输入保持旧结果并显示具体错误。快捷日期立即应用；盒子选择也立即应用，并提交当前日期草稿。</dd></div>\n<div><dt>为什么展示</dt><dd>避免输入到一半时结果被误认为已按新条件查询。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>Box type / All 4 boxes</h4><dl>\n<div><dt>是什么</dt><dd>按奖品来源盒子筛选，不是 Common/Rare 等稀有度。</dd></div>\n<div><dt>数据来源</dt><dd>稳定 box_id；原型固定 BX001=$5 Box、BX002=$20 Box、BX003=$50 Box、BX004=$100 Box。</dd></div>\n<div><dt>怎么算</dt><dd>All 4 boxes汇总四个ID；单选只保留对应ID的所有业务事件及期末存量。</dd></div>\n<div><dt>规则／异常</dt><dd>盒子更名、改价、修改配置不改变历史归属；历史金额不能按现价回算。原型看板账本独立于奖池编辑；新建Box不会自动产生演示交易。</dd></div>\n<div><dt>为什么展示</dt><dd>横向比较四类盒子，不把稀有度误当盒子类型。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>As of / UTC / Demo snapshot</h4><dl>\n<div><dt>是什么</dt><dd>期末存量的截止时间、报表时区、演示数据截止日。</dd></div>\n<div><dt>数据来源</dt><dd>服务端快照；当前演示为UTC下2026-10-12完整日。</dd></div>\n<div><dt>怎么算</dt><dd>历史存量按E次日00:00:00之前已发生的事件还原；未来事件不影响历史状态。</dd></div>\n<div><dt>规则／异常</dt><dd>演示日期固定，不随机器时间推进。生产时区、日切和实时刷新频率待确认；UI标注UTC，避免隐含使用中国时间或美国时间。</dd></div>\n<div><dt>为什么展示</dt><dd>让运营知道看的是哪一天、哪个时区的存量。</dd></div>\n</dl></section>\n</details>\n<details open class=\"field-group\"><summary>销售指标</summary>\n<section class=\"field-definition\"><h4>Boxes sold / Sales → Sold</h4><dl>\n<div><dt>是什么</dt><dd>支付成功的盒子件数，不是订单数，也不是已开盒次数。</dd></div>\n<div><dt>数据来源</dt><dd>支付成功台账中的每个购买盒子实例（unit_id），以 paid_at 归期。</dd></div>\n<div><dt>怎么算</dt><dd>Count distinct unit_id where paid_at∈本期且box_id匹配。订单买5盒计5；重复支付回调只计一次。</dd></div>\n<div><dt>规则／异常</dt><dd>未支付、支付失败、赠送的零对价盒子不按付费销售计入；赠送事件应由独立类型区分。退款如何冲减历史销量待确认，当前演示不模拟退款。</dd></div>\n<div><dt>为什么展示</dt><dd>衡量成交数量，并支持不同盒子之间比较。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>Paid sales / Sales → Paid sales</h4><dl>\n<div><dt>是什么</dt><dd>用户为盒子实际支付的订单商品金额，按盒子归属分摊。它不是净利润。</dd></div>\n<div><dt>数据来源</dt><dd>支付成功时保存的每件/每条订单商品实付金额 paidCents；真实接口需提供订单金额分摊结果。</dd></div>\n<div><dt>怎么算</dt><dd>Σ paidCents / 100；先以整数分汇总，最后显示美元2位小数。不能用当前盒子售价×历史销量替代。</dd></div>\n<div><dt>规则／异常</dt><dd>演示无优惠，每盒实付等于演示售价。生产订单优惠应按确定的分摊规则锁定；运费、税费不混入盒子商品金额。余额/赠金是否计入实付、退款是否冲减及分摊舍入规则待业务确认。</dd></div>\n<div><dt>为什么展示</dt><dd>在不同价位盒子之间比较销售规模。</dd></div>\n</dl></section>\n</details>\n<details open class=\"field-group\"><summary>奖品流转与期末存量</summary>\n<section class=\"field-definition\"><h4>Prizes recycled / Quantity</h4><dl>\n<div><dt>是什么</dt><dd>所选期间完成回收的奖品件数。</dd></div>\n<div><dt>数据来源</dt><dd>回收成功记录 recycled_at 与奖品持有实例ID。原型每个购买盒子实例对应一件奖品。</dd></div>\n<div><dt>怎么算</dt><dd>按成功回收时间归期，对本次奖品持有实例去重后计件。</dd></div>\n<div><dt>规则／异常</dt><dd>未完成/失败的回收不计。实体商品被回收后再次抽出，应产生新的持有实例，不能用SKU ID去重。生产若存在异步回收申请中状态，待处理是否排除应补业务状态映射；本原型回收选择与成功回收同一事件。</dd></div>\n<div><dt>为什么展示</dt><dd>衡量奖品通过回收流出的数量。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>Prizes recycled / Market value</h4><dl>\n<div><dt>是什么</dt><dd>被回收奖品的市场价总额，不是实际回收支付金额。</dd></div>\n<div><dt>数据来源</dt><dd>每件奖品回收成功时的市场价快照 recycledMarketCents。</dd></div>\n<div><dt>怎么算</dt><dd>Σ(每件成功回收奖品的市场价快照)，按回收日期及Box筛选。批量明细则Σ数量×单价。</dd></div>\n<div><dt>规则／异常</dt><dd>本原型采用回收时快照以避免历史漂移；正式价格快照时点/价格来源待确认。缺少任一价格则相关行及汇总金额显示—，数量仍保留，不能按0补值。</dd></div>\n<div><dt>为什么展示</dt><dd>描述回收奖品的价值规模；不得当作现金流出或利润成本。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>Shipping requested / Quantity</h4><dl>\n<div><dt>是什么</dt><dd>用户已成功提交寄出申请的奖品件数；不要求仓库发货。此为用户本轮确认的寄出口径。</dd></div>\n<div><dt>数据来源</dt><dd>服务端成功受理 shipping_requested_at 与申请下的奖品实例明细。不是 dispatched_at。</dd></div>\n<div><dt>怎么算</dt><dd>统计首次成功申请时间位于本期的奖品实例数量。一次申请3件计3件，不是1单。成功申请后的奖品从期末未选择处理方式的奖品中移除。</dd></div>\n<div><dt>规则／异常</dt><dd>点击后提交成功即计入；仅打开确认弹窗、取消、验证失败、网络失败未成功落库不计。按钮连点、重试、回调重复均不得重复计数。取消寄出再申请如何冲回/重计待确认，原型不模拟撤销。</dd></div>\n<div><dt>为什么展示</dt><dd>直接反映用户选择寄出的规模，与仓库履约阶段分开。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>Shipping requested / Purchase cost</h4><dl>\n<div><dt>是什么</dt><dd>已申请寄出奖品的采购价总额。</dd></div>\n<div><dt>数据来源</dt><dd>每件奖品成功提交寄出申请时锁定的采购价 shippingCostCents；应来自奖品成本台账。</dd></div>\n<div><dt>怎么算</dt><dd>Σ符合申请时间与Box条件的奖品采购价。示例批量2件，采购价$20与$35，数量2，总额$55。</dd></div>\n<div><dt>规则／异常</dt><dd>不等待发货，不使用市场价，不包含物流费。不用SKU当前采购价回写旧申请。采购批次成本分配及快照时点需服务端确认。缺价显示—并保留数量。</dd></div>\n<div><dt>为什么展示</dt><dd>评估用户选择寄出的奖品对应采购成本规模；不是当期已确认会计成本。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>Pending prizes / Quantity</h4><dl>\n<div><dt>是什么</dt><dd>截至结束日期已开出，且尚未选择回收或寄出的奖品存量。</dd></div>\n<div><dt>数据来源</dt><dd>opened_at、回收/寄出成功事件的历史记录。</dd></div>\n<div><dt>怎么算</dt><dd>opened_at&lt;E次日，且截至该时刻没有成功回收或寄出选择。与开始日期无关。</dd></div>\n<div><dt>规则／异常</dt><dd>包含所选期间之前开出的奖品。未来寄出/回收不能改变过去的存量。已申请寄出未发货不属于本项。异步回收流程如存在，需要增加回收选择时间以保持“未选择”的定义。</dd></div>\n<div><dt>为什么展示</dt><dd>了解仍由用户持有、尚未决定处置的奖品规模；不是运营待办。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>Pending prizes / Market value</h4><dl>\n<div><dt>是什么</dt><dd>期末待处理奖品按市场价估值的合计。</dd></div>\n<div><dt>数据来源</dt><dd>期末每件奖品可用的最近市场价快照 marketHistory。</dd></div>\n<div><dt>怎么算</dt><dd>先确定期末待处理集合，再取每件奖品在截止前最近一条市场价，汇总。</dd></div>\n<div><dt>规则／异常</dt><dd>原型支持历史价格，不用现在价格覆盖历史日期；正式是否采用期末市场价或开出时锁价需确认。无价格快照显示—。重复SKU按持有件数累计，不按SKU种类数累计。</dd></div>\n<div><dt>为什么展示</dt><dd>展示未选择处置奖品的价值规模，不能等同采购成本或公司负债。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>Unopened boxes</h4><dl>\n<div><dt>是什么</dt><dd>截至结束日期已购买但尚未开出的盒子件数。</dd></div>\n<div><dt>数据来源</dt><dd>支付成功的盒子实例 paid_at 和 opened_at。</dd></div>\n<div><dt>怎么算</dt><dd>paid_at&lt;E次日，且opened_at为空或≥E次日。对购买实例去重计件。</dd></div>\n<div><dt>规则／异常</dt><dd>包含更早日期购买的盒子；不包含未支付盒子。退款取消后是否移除及归期待确认，演示无退款台账。此项只展示数量，没有自加金额。</dd></div>\n<div><dt>为什么展示</dt><dd>了解用户已购买但尚未消费的盒子存量。</dd></div>\n</dl></section>\n</details>\n<details open class=\"field-group\"><summary>明细表与显示参数</summary>\n<section class=\"field-definition\"><h4>Breakdown by box / Box type</h4><dl>\n<div><dt>是什么</dt><dd>按原始来源Box分组的同口径明细表。</dd></div>\n<div><dt>数据来源</dt><dd>稳定Box ID映射名称；所有指标复用上方汇总的同一个查询结果。</dd></div>\n<div><dt>怎么算</dt><dd>每行分别应用本表所有指标公式；单选时只显示选中行。</dd></div>\n<div><dt>规则／异常</dt><dd>四类是$5/$20/$50/$100 Box，不是六类稀有度。表格位于已归属利润下方，末列增加Realized profit。每项数量和金额独立列，不添加排序下拉框。</dd></div>\n<div><dt>为什么展示</dt><dd>快速比较各盒子的贡献及奖品去向。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>All boxes / Selected total</h4><dl>\n<div><dt>是什么</dt><dd>当前筛选范围的合计行。</dd></div>\n<div><dt>数据来源</dt><dd>明细行完整集合。</dd></div>\n<div><dt>怎么算</dt><dd>每个数值列分别求和；上方对应汇总必须相等。</dd></div>\n<div><dt>规则／异常</dt><dd>单盒时显示 Selected total；金额存在缺价时合计也显示—，不能显示已知部分冒充完整总额。不能把不同价格口径的三组金额横向相加成利润。</dd></div>\n<div><dt>为什么展示</dt><dd>对账并确认筛选范围。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>USD / count / — / 0</h4><dl>\n<div><dt>是什么</dt><dd>美元、件数、金额不可计算、确定无业务四类显示。</dd></div>\n<div><dt>数据来源</dt><dd>整数分、整数件数和数据完整性标志。</dd></div>\n<div><dt>怎么算</dt><dd>金额2位小数及千分位；件数整数。先汇总后格式化。</dd></div>\n<div><dt>规则／异常</dt><dd>—不等于0；0表示已查询且确无活动。错误/未知数据不得显示0。金额演示使用整数分避免小数累加误差。</dd></div>\n<div><dt>为什么展示</dt><dd>让数字可比较，并区分无数据、零业务与缺价。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>Metric definitions / Demo data</h4><dl>\n<div><dt>是什么</dt><dd>产品说明入口与演示标识。</dd></div>\n<div><dt>数据来源</dt><dd>product-guide.html#dashboard；固定生成的7650条购买实例账本。</dd></div>\n<div><dt>怎么算</dt><dd>点击新窗口打开看板中文规则；看板仅查询内存里的演示记录。</dd></div>\n<div><dt>规则／异常</dt><dd>无真实支付、回收、寄出、价格或库存接口；筛选不会写回库存，也不修改Total drawn。刷新恢复默认最近7天；同页切换Boxes再回来保留已应用筛选。</dd></div>\n<div><dt>为什么展示</dt><dd>防止把演示状态误认为真实经营结果。</dd></div>\n</dl></section>\n</details>\n<details open class=\"field-group\"><summary>已归属收入、成本与利润</summary>\n<section class=\"field-definition\"><h4>Resolved boxes / Attribution date</h4><dl>\n<div><dt>是什么</dt><dd>已经完成回收或已成功申请寄出的盒子，是已归属集合。</dd></div>\n<div><dt>数据来源</dt><dd>购买实例unit_id关联奖品处置事件；使用第一次成功回收或寄出申请的时间。</dd></div>\n<div><dt>怎么算</dt><dd>选出成功处置时间位于[S日零点,E次日零点)且box_id符合筛选的实例。每个实例只归属一次。</dd></div>\n<div><dt>规则／异常</dt><dd>未开盒、已开出但尚未选择处置的奖品均不归属；按钮点击失败不算。原型一盒一奖品，双事件异常按最早成功事件一次归属；生产应保证处置状态互斥。</dd></div>\n<div><dt>为什么展示</dt><dd>让收入和成本来自相同一批盒子，避免跨日错配。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>Realized revenue</h4><dl>\n<div><dt>是什么</dt><dd>本期已归属盒子所对应的原始实付收入。</dd></div>\n<div><dt>数据来源</dt><dd>同一已归属集合关联支付时锁定的paidCents，含本期以前购买的盒子。</dd></div>\n<div><dt>怎么算</dt><dd>Σ已归属盒子的历史实付商品金额。演示$41,180.00。</dd></div>\n<div><dt>规则／异常</dt><dd>不是本期Paid sales，不用现价乘数量；同盒重复回调不增加收入。原型无优惠，正式优惠须先分摊并锁定到每盒。缺失金额显示—。</dd></div>\n<div><dt>为什么展示</dt><dd>说明本期已确定处置结果的盒子带来多少收入。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>Buyback cost</h4><dl>\n<div><dt>是什么</dt><dd>本期已归属集合中，回收实际付给用户的金额。</dd></div>\n<div><dt>数据来源</dt><dd>成功回收事件锁定的buybackCostCents；不读取recycledMarketCents。</dd></div>\n<div><dt>怎么算</dt><dd>Σ本期成功回收实例的实际回收支付金额。演示$18,920.00。</dd></div>\n<div><dt>规则／异常</dt><dd>实际回收支出可与市场价不同；不能用回收奖品市场价总额$38,420代替。零成本合法，缺失成本显示—并使总成本和利润显示—。</dd></div>\n<div><dt>为什么展示</dt><dd>作为已归属总成本的一部分。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>Purchase cost — realized cost</h4><dl>\n<div><dt>是什么</dt><dd>本期已归属集合中，成功申请寄出奖品的采购成本。</dd></div>\n<div><dt>数据来源</dt><dd>shippingCostCents，与Shipping requested / Purchase cost复用同一金额和实例集合。</dd></div>\n<div><dt>怎么算</dt><dd>Σ本期成功寄出申请对应采购价。演示$16,850.00。</dd></div>\n<div><dt>规则／异常</dt><dd>用户成功申请就锁定，不等仓库发货；不是运费，不是市场价。缺失采购价传播为利润不可计算。</dd></div>\n<div><dt>为什么展示</dt><dd>作为已归属总成本的另一部分。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>Total realized cost</h4><dl>\n<div><dt>是什么</dt><dd>本期已归属盒子的两类已确定成本之和。</dd></div>\n<div><dt>数据来源</dt><dd>实际回收成本与寄出采购成本。</dd></div>\n<div><dt>怎么算</dt><dd>Buyback cost + Purchase cost = $18,920 + $16,850 = $35,770。</dd></div>\n<div><dt>规则／异常</dt><dd>只加同一已归属集合的成本。不再对回收奖品额外扣一次采购价。任何必需成本缺失显示—。</dd></div>\n<div><dt>为什么展示</dt><dd>展示已确定的盒子成本。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>Realized profit / Breakdown → Realized profit</h4><dl>\n<div><dt>是什么</dt><dd>本期已归属收入减去对应成本后的经营利润指标。</dd></div>\n<div><dt>数据来源</dt><dd>同一归属日期、盒子范围及去重集合的收入和成本。</dd></div>\n<div><dt>怎么算</dt><dd>Realized revenue − Total realized cost = $41,180 − $35,770 = $5,410。四盒分别$310、$1,600、$1,420、$2,080。</dd></div>\n<div><dt>规则／异常</dt><dd>负值允许并标红；零值显示$0.00；缺失收入或成本时显示—。未归属盒子不预测利润。不含物流、支付手续费、税费或其他经营支出，不定义为公司净利润或财务会计收入确认。</dd></div>\n<div><dt>为什么展示</dt><dd>展示已经确定处置结果的业务贡献。</dd></div>\n</dl></section>\n</details>\n<details open class=\"field-group\"><summary>未归属收入与期末未处理集合</summary>\n<section class=\"field-definition\"><h4>Unrealized revenue / Breakdown → Unrealized revenue</h4><dl>\n<div><dt>是什么</dt><dd>截至结束日仍未确定最终处置结果的盒子对应的原始实付收入，不是未归属利润。</dd></div>\n<div><dt>数据来源</dt><dd>已购买未开盒、已开盒但尚未选择回收或寄出的两类购买实例，关联paidCents。</dd></div>\n<div><dt>怎么算</dt><dd>未归属收入=两类实例的原始实付金额之和。示例$18,040+$6,180=$24,220；共672+244=916盒。</dd></div>\n<div><dt>规则／异常</dt><dd>按结束日存量，包含更早购买，与开始日无关。沿用Box筛选并按unit_id去重。缺少任一支付金额显示—；不使用奖品市场价，不用现售价回算。不能把期末未归属收入与本期已归属收入直接相加当作本期销售。</dd></div>\n<div><dt>为什么展示</dt><dd>明确已经收款但用户还没确定回收或寄出结果的收入规模。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>Opened · No choice yet</h4><dl>\n<div><dt>是什么</dt><dd>已开盒，但尚未选择回收或寄出的未归属收入及盒数。</dd></div>\n<div><dt>数据来源</dt><dd>期末Pending prizes所关联的购买实例与原始支付金额。</dd></div>\n<div><dt>怎么算</dt><dd>Σ该集合paidCents；盒数复用Pending prizes（本原型一盒一奖品）。演示672盒、$18,040收入；奖品市场价$24,360是另一口径。</dd></div>\n<div><dt>规则／异常</dt><dd>成功回收或成功申请寄出后从该存量移除；仅点击失败不移除。未来处理不改写过去日期的状态。</dd></div>\n<div><dt>为什么展示</dt><dd>区分已经开盒、仍未处置的部分。</dd></div>\n</dl></section>\n<section class=\"field-definition\"><h4>Purchased · Not opened</h4><dl>\n<div><dt>是什么</dt><dd>已购买但尚未开盒的未归属收入及盒数。</dd></div>\n<div><dt>数据来源</dt><dd>期末Unopened boxes集合中的原始支付金额。</dd></div>\n<div><dt>怎么算</dt><dd>Σ该集合paidCents；演示244盒、$6,180。总未归属盒数=未开盒+已开盒未处置。</dd></div>\n<div><dt>规则／异常</dt><dd>开盒后先转入已开盒未处置，收入总未归属额不变；成功回收/寄出后才转为已归属。实际成本与利润尚未确定，不能假定为0成本或把全额收入显示为利润。</dd></div>\n<div><dt>为什么展示</dt><dd>区分用户还没开盒的部分。</dd></div>\n</dl></section>\n</details>\n<h3>后端最小数据契约</h3><p>以下为开发所需语义字段，不强制数据库命名；原型采用单件记录，接口使用批量数量时应按明细数量等价展开。</p><table class=\"formula-table\"><thead><tr><th>参数</th><th>含义</th><th>校验／边界</th></tr></thead><tbody>\n<tr><td>unit_id / ownership_id</td><td>每个购买盒子及本次奖品持有关系的稳定唯一ID；不是SKU ID。</td><td>字符串；不能缺失。原型一盒一奖品，以unit_id代表持有实例；生产允许多奖品时须独立prize_instance_id。</td></tr>\n<tr><td>box_id</td><td>历史来源盒子ID。</td><td>非空稳定键；名称/价格变化不能改变归属。</td></tr>\n<tr><td>paid_at / paidCents</td><td>支付成功时刻及分摊到该盒子实例的实付商品金额。</td><td>时间戳与非负整数分；失败支付不写成功时间；金额缺失显示—，不显示错误零值。</td></tr>\n<tr><td>buybackCostCents</td><td>成功回收时的实际回收支出。</td><td>非负整数分；按成功事件冻结；缺失不能用市场价或零替代。</td></tr>\n<tr><td>opened_at</td><td>成功开盒并生成奖品实例的时间。</td><td>可空；空表示尚未开盒。应≥paid_at。</td></tr>\n<tr><td>recycled_at / recycledMarketCents</td><td>回收成功时间及当时奖品市场价快照。</td><td>可空；成功时间≥opened_at；重复回调幂等；市场价不可从现配置回填旧记录。</td></tr>\n<tr><td>shipping_requested_at / shippingCostCents</td><td>用户寄出申请成功受理时间及采购价快照。</td><td>可空；成功时间≥opened_at；从申请明细计件，不能从运单数量计数。</td></tr>\n<tr><td>marketHistory[].at / cents</td><td>市场价生效时刻和价格。</td><td>按有效时间查询截止前最后一条；顺序不依赖入库顺序；无快照标记缺价。</td></tr>\n<tr><td>source coverage / as_of / reporting_timezone</td><td>数据覆盖起点、报表截点和统一时区。</td><td>生产查询返回；前端不得用机器时间猜测数据完整性。</td></tr>\n<tr><td>request_id / revision</td><td>申请幂等键与报表快照版本。</td><td>生产接口字段，原型未连接。一次响应内汇总/明细应共享同一快照，避免并发期间互相对不上。</td></tr>\n</tbody></table><h3>计算例子</h3><p>用户9月30日买3盒，10月6日开2盒，其中1件10月7日成功申请寄出（采购价$20），另一件至10月12日仍未选择处理方式（期末市场价$35）。筛选10月6–12日：这批记录销售数量为0、销售额为0；Shipping requested为1／$20；Pending prizes为1／$35；Unopened boxes为1。10月10日仓库真正发货不会再增加寄出数量。由此可见，不能用“本期销量−本期回收−本期寄出”计算期末待处理。</p>\n<h3>归属跨日示例</h3><p>10月1日支付$20买盒，10月8日成功申请寄出，采购价$12。查询10月8日：这只盒子不计当天销售，却贡献已归属收入$20、成本$12、利润$8。若10月8日仍未开盒或奖品未选择处置，则已归属收入和利润均不计入。</p>\n<h3>待确认的业务与接口边界</h3><ul><li>生产报表时区、日切及刷新频率。</li><li>实付金额的余额／赠金范围、订单优惠分摊、退款冲回规则。当前演示是支付成功商品金额，非净收入。</li><li>市场价来源：回收时快照、期末估值或开出锁价；采购批次成本及锁定时点。原型暂按回收／申请时快照和期末市场价展示。</li><li>寄出申请取消／重新申请、回收撤销、异步回收选择与完成之间的状态。未确认前不得推断扣减历史指标。</li><li>一盒多奖品的收入分摊与部分归属规则待确认；当前一盒一奖品。生产历史事件回溯、幂等、统一快照、缺价提示明细与API失败／重试。当前离线原型不代表后端已实现。</li></ul>\n<h3>开发验收</h3><ul><li>批量申请3件计3，不是申请单数；重复同一成功事件不增加；尚未真实发货也计入。</li><li>同一件成功申请的奖品，不再进入该时点之后的Pending prizes；查看申请之前的历史日期仍应存在。</li><li>四盒明细之和等于汇总；分盒已归属利润之和等于上方已归属利润；筛选不改变历史台账。</li><li>只改开始日不改变同一结束日的待处理数量；过去购买的未开盒应保留。</li><li>跨日边界、负利润、缺价格、空期间、单盒、全部盒子和所有快捷日期均有明确结果。</li><li>奖池编辑、动态抽奖模拟、库存调整不会改写看板交易台账。生产上线须独立验证真实支付／回收／申请事件。</li></ul><h3>交付与验证边界</h3><p>ui.html内嵌本地编译的Tailwind CSS和JavaScript，可直接离线打开。默认Dashboard，Boxes保留原配置管理。src/dashboard-model.js为演示台账和计算；src/dashboard.js为界面；dashboard-field-specs.json为逐字段说明数据。dashboard-model-verification.json和dashboard-browser-verification.json记录验证范围。演示日期为2026-10-12；数据包含7650个购买实例，最新7天总计2480盒、$65,400实付销售额。个别分盒回收数量与最初设计图不同，以可复算的演示账本为准；不能把图中静态数值视为真实报表。</p></div>";const boxMedia="<section><h2>Box 图片与开盒视频 URL</h2><h3>功能说明</h3><p>创建和编辑Box沿用已确认设计：名称和售价并排，下方填写必填Min Value和Max Value；Box media区域内图片URL单独一行，Web opening video URL与App opening video URL并排，下方保留六类概率。</p><h3>交互逻辑</h3><p>三个字段共用Open media hosting website入口；运营先到该网站上传图片和两个端的视频，再复制各自直链回填。网站尚未确定，按钮暂禁用；与SKU图片入口共用src/app.js的IMAGE_UPLOAD_WEBSITE_URL配置。表单不提供本地上传。</p><p>新建Box图片URL必填。视频字段按确认图暂可留空，填写时校验HTTPS URL。三个链接分别保存为imageUrl、webOpeningVideoUrl、appOpeningVideoUrl；切换标签保留，Save draft保存草稿，Publish写入新配置，取消编辑恢复基线。它们不改变概率、采购成本、库存或累计抽出。</p><h3>异常状态</h3><p>空图片URL、格式错误或非HTTPS阻止创建／保存／发布并保留其他输入。原型只校验链接格式，不验证资源可访问性、图片类型或视频能否播放；输入链接不代表上传成功。远端图片展示需要联网；视频仅保存URL，不下载或播放。正式系统的资源校验、转存、文件规格、编码、时长及视频必填策略待确认。</p><p>旧配置中只有内嵌图片而没有imageUrl时，显示Existing image retained提示并保留原图，不编造来源链接；首次填写新URL替换原图，明确清空后须重新填写。旧视频缺失按空值兼容。</p><h3>交互入口</h3><p><a href=\"ui.html?scene=create\" target=\"_blank\">创建Box →</a>　<a href=\"ui.html?scene=basic\" target=\"_blank\">编辑Box →</a></p><h3>当前界面</h3><p>英文交互页面实际截图，包含最新价值范围字段。</p><img src=\"screens/04-basic.png\" alt=\"Box图片与Web App开盒视频URL表单设计\" style=\"width:100%;height:auto\"></section>";const skuWarnings="<section><h2>SKU 价格与库存提醒 · 2026-10-10</h2><h3>功能说明</h3><p>适用于新增与编辑 SKU；沿用当前 Box 与分类的建议市场价范围。建议范围包括上下限，无范围资料时不臆造范围。</p><h3>交互逻辑</h3><ol><li>市场价低于下限或高于上限：输入框红边，字段下方红字提示建议范围。输入价格或切换分类时实时更新，回到区间内立即消除。</li><li>提交前先检查必填项及数字是否合法；通过后若市场价超区间，立即弹出 Confirm market price，列出分类、建议区间、输入金额。Keep editing／关闭／Esc 返回完整表单；Add anyway／Apply anyway 允许继续应用。一次提交只需一次确认，二次弹窗保留在原表单上层。</li><li>市场价严格大于100美元，且库存严格大于50：库存区域下方出现黄色图标与文字 High-value inventory risk，提醒复核进货价与抽中概率。不用黄色背景卡片，不额外阻止提交。新增按初始库存判断；编辑按当前只读库存判断。</li><li>红色价格提示与黄色库存风险提示独立，可同时显示；只有黄色提醒时直接按正常校验提交。</li></ol><h3>异常状态</h3><p>价格空值、非有限数或≤0仍按原必填／数值规则拦截；未选分类或新Box没有建议区间时不显示超区间提醒，但高价高库存判断独立生效。确认后图片加载失败保留原表单；重复点击不重复应用；取消或切换表单后旧请求不能写入新表单。</p><h3>开发验收</h3><p>区间[100,119.80]：100与119.80不标红，99.99与119.81标红。价格100／库存51、价格101／库存50均不触发黄色提醒；价格101／库存51触发。示例价格150、库存60同时触发两种提醒。二次确认不保存草稿、不发布、不调整权重和库存。这些提醒不是盈利或亏损结论，整盒概率与采购成本仍决定理论毛收益。本次实现范围是新增／编辑SKU表单，批量导入和Adjust stock沿用原流程。</p><h3>交互演示</h3><p><a href=\"ui.html?scene=sku-range-warning\" target=\"_blank\">价格超区间 →</a>　<a href=\"ui.html?scene=sku-price-confirm\" target=\"_blank\">二次确认 →</a>　<a href=\"ui.html?scene=sku-risk-warning\" target=\"_blank\">高价高库存 →</a></p><p>示例使用$100 Box／Rare建议区间100.00–119.80美元。以下为已确认设计参考图，非本次浏览器截图。</p><h3>超区间标红</h3><img src=\"references/sku-warnings-2026-10-10/01-price-range-warning.png\" alt=\"设计参考：超区间标红\" style=\"width:100%;height:auto\"><h3>提交时二次确认</h3><img src=\"references/sku-warnings-2026-10-10/02-price-confirmation.png\" alt=\"设计参考：提交时二次确认\" style=\"width:100%;height:auto\"><h3>高价高库存黄色提醒</h3><img src=\"references/sku-warnings-2026-10-10/03-high-value-stock-warning.png\" alt=\"设计参考：高价高库存黄色提醒\" style=\"width:100%;height:auto\"></section>";const formula="<section class=\"stock-profit-rule\" style=\"color:#b42318\">\n<h2>新增规则：整盒收益校验与自动停售</h2>\n<p><strong>已确认的正式开发要求。判断单位始终是整个 Box；单个 SKU 缺货只触发重算，不直接触发停售。以下新增说明全部标红。当前离线原型尚未接入真实抽奖服务、自动停售或系统通知。</strong></p>\n<h3>功能说明</h3>\n<p>汇总当前 Box 所有分类、所有可抽商品的概率与采购成本，判断整个 Box 是否具有正的理论每抽毛收益。不要求每个分类赚钱，也不要求每件商品被抽中时赚钱；理论平均收益为正不保证每次实际抽奖或每批订单盈利。本规则只计算奖品采购成本，不计手续费等其他费用。</p>\n<p><strong>整盒理论每抽成本＝Σ（每个可抽 SKU 的整盒中奖概率 × 采购成本）。<br>整盒理论每抽毛收益＝开盒售价 − 整盒理论每抽成本。<br>整盒理论毛利率＝整盒理论每抽毛收益 ÷ 开盒售价 × 100%。</strong></p>\n<p>例如 $5 Box：整盒平均成本 $4，则理论每抽毛收益 $1、毛利率 20%，可以继续销售；成本 $5，则毛收益与毛利率均为 0；成本 $6，则毛收益 −$1、毛利率 −20%。后两种情况均暂停销售。按未四舍五入的计算值判断，不以界面两位小数或随机模拟结果判断。</p>\n<h3>交互逻辑</h3>\n<ol>\n<li><strong>触发重算：</strong>真实抽奖扣库存或人工调整使 SKU 库存从正数变为 0 时，该商品保留记录、退出可抽集合、概率归零。只重算同分类剩余有货商品的概率，保留原权重与分类总概率；不均摊，不定向转给便宜商品，不跨分类分配。</li>\n<li><strong>汇总整盒：</strong>按已发布配置的售价、分类概率、权重和采购成本，结合最新有效库存，重新计算所有分类的成本总和及整盒毛收益、毛利率。当前 Tab、搜索、分页或未发布草稿不得影响线上判断。</li>\n<li><strong>毛收益 &gt; 0：</strong>在所有正概率分类均可抽取的前提下继续销售，并同步前台有效奖品及概率。单 SKU 缺货或某分类成本较高，均不能单独作为停售理由。</li>\n<li><strong>毛收益 ≤ 0：</strong>立即暂停整个 Box 的新购买，同时发送系统提醒；不等待运营查看或确认提醒才停售。保留配置、库存和历史记录，不删除 Box。</li>\n<li><strong>提醒与处理：</strong>提醒包含 Box 名称／ID、触发 SKU、原因、售价、重算后的整盒成本、毛收益、毛利率及发生时间，并提供该 Box 的处理入口。运营补货或调整配置后重新校验；所有正概率分类可抽且整盒毛收益 &gt; 0，方可由运营确认恢复上线，不自动恢复。</li>\n</ol>\n<h3>异常状态</h3>\n<p><strong>正概率分类全部缺货：</strong>原定抽奖规则无法完整执行，直接暂停整个 Box 并提醒，即使无法计算收益也不能继续销售。显示无法计算及具体原因，不伪造零成本、零收益，不将该分类概率转给其他分类。</p>\n<p><strong>已确认购买的订单：</strong>按购买时锁定的概率版本和规则处理，不套用后续新概率。用户确认购买前若有效概率已变化，更新展示并要求重新确认。已受理订单的履约或退款异常处理由订单服务落实，不能静默换奖或重抽。</p>\n<h3>开发验收与边界</h3>\n<p>服务端应协调库存扣减、有效概率更新、整盒收益校验与售卖状态，确保库存变化后的新订单不能使用旧的可售结果。后台列表状态与前台购买入口同步；通知失败不得导致恢复销售，通知需记录失败并重试。补货、发布生效及恢复上线同样校验最新有效配置，不能绕过整盒毛收益 &gt; 0 的可售条件；未发布草稿不影响线上。</p>\n<p>验收至少覆盖：单 SKU 缺货但整盒仍盈利时继续销售；其他分类仍有货但整盒毛收益为零／负数时停售；正概率分类全部缺货时停售；补货后重新校验并人工恢复；并发购买不能绕过停售；停售不改写已确认订单的规则。</p>\n<p><strong>原型差异：</strong>已有“亏损仅提醒、仍可发布／上线”的截图及交互仅代表旧版离线演示，不作为正式可售规则；正式售卖与恢复上线以本节为准。通知渠道和接口实现待后端对接。本次仅补充说明，未实现自动停售服务。</p>\n</section>\n<section class=\"stock-profit-rule\" style=\"color:#b42318\">\n<h3>已更新：动态库存模拟</h3>\n<p>Run simulation现在复制整个Box的当前配置与准确库存，最多运行100,000抽。每抽扣减对应SKU的一份模拟库存；售罄后保留原权重、重算同分类概率，再汇总整个Box的理论收益。</p>\n<p>开始前及每次售罄重算后检查：整盒理论每抽毛收益≤0，或正概率分类全部缺货，立即结束模拟并说明原因；否则继续到抽数上限。单SKU缺货但整盒仍可抽且理论盈利时继续。停售依据是下一抽的理论收益，不是已经累计赚了多少钱。</p>\n<p>结果展示完成／计划抽数、停止原因、累计模拟收入、累计奖品成本、累计模拟毛收益、平均每抽毛收益、结束时理论每抽毛收益及毛利率，并列出本轮售罄SKU和售罄发生的抽数。0抽时累计为0、平均为—；正概率分类售罄导致理论值无法计算时显示—。</p>\n<p>任意库存数量变化都会使旧模拟结果过期。本轮不模拟补货；真实库存、Total drawn和Box上线状态均不改变，也不发送生产停售通知。动态模拟已实现；正式自动停售与通知服务仍待接入。旧固定概率模拟截图不再展示，请通过本页“打开对应交互状态”查看新版结果。</p>\n</section>\n<div class=\"calc-guide\"><h2>概率和成本怎么算</h2><p class=\"calc-intro\">先算商品被抽中的概率，再算每抽成本，最后和开盒价比较。</p><p class=\"calc-example-label\">以一个售价 $20 的 Box 为例 · 独立教学示例，不对应当前四档样例数据</p>\n<ol class=\"calc-steps\">\n<li><h3>算这个商品被抽中的概率</h3><p>Common 占 23%；该商品权重为 40，同类所有有库存商品的权重合计为 100。</p><p class=\"calc-equation\">权重40除以总权重100，再乘以分类概率23%，得到<strong>9.20%</strong>。</p><p class=\"calc-meaning\">表示每次开盒有 9.20% 的概率抽中它。权重只决定它在同类中的相对机会。</p></li>\n<li><h3>算它给每抽带来多少成本</h3><p>这个商品的进货价是 $4，把进货价乘以刚算出的概率。</p><p class=\"calc-equation\">进货价4美元乘以抽中概率9.20%，得到<strong>每抽0.3680美元</strong>。</p><p class=\"calc-meaning\">把六个分类中所有商品的成本贡献相加，就得到整盒的理论每抽成本。本例约为 $14.23。</p></li>\n<li><h3>看开盒价能不能覆盖成本</h3><p>开盒价减去整盒的理论每抽成本，就是理论每抽毛收益。</p><p class=\"calc-equation\">售价20美元减去平均成本约14.23美元，得到<strong>每抽约5.77美元</strong>。</p><p class=\"calc-meaning\">旧版离线原型中，结果小于 0 时标红提醒且仍可发布；正式销售按本页新增红字规则，整盒毛收益≤0时停售。这里只计算采购成本，尚未扣运费、手续费等费用。</p></li>\n</ol>\n<p class=\"calc-note\">这是长期平均值，不代表每一抽都会赚 $5.77，也不等于卖完库存的总利润。</p>\n<h3>先分清：数值大，不一定更好</h3>\n<p><b>整盒理论成本与毛收益：</b>用于判断当前标价是否覆盖预计采购成本；毛收益为正不等于净盈利。</p>\n<p><b>单SKU成本贡献：</b>用于找主要成本来源，不给商品打好坏分。贡献高可能是采购价高，也可能是常被抽中；应结合奖品价值与整盒结果决定是否调整。</p>\n<p><b>模拟成本差额：</b>用于看模拟与理论的接近程度，接近零才表示接近；负数不是亏损。</p>\n<details class=\"calc-detail\"><summary>例子：为什么不能直接删掉有成本贡献的商品？</summary><div class=\"calc-detail-body\">\n<p>独立教学示例：某分类概率20%，里面只有A、B两个有库存商品，权重相同。A进货价4美元，B进货价20美元，因此各自整盒概率为10%。A每抽贡献0.40美元，B贡献2.00美元，该类合计贡献2.40美元。</p>\n<p>如果移除便宜的A，B承接该类全部20%概率，每抽贡献变成4.00美元。其他类别不变时，<b>整盒平均成本反而增加1.60美元</b>。因此单行贡献下降或被删除，不保证整盒成本下降；应查看重新分配后的整盒结果。</p>\n<p>另一个独立例子：进货价20美元、概率1%的商品贡献0.20美元；进货价4美元、概率20%的商品贡献0.80美元。便宜但常出的商品也可能是更大的成本来源。</p>\n</div></details>\n<details class=\"calc-detail\"><summary>当前成本大和这次增加得多，是两件事</summary><div class=\"calc-detail-body\"><p>当前成本贡献描述现在每抽占用多少钱；成本增量描述本次贡献减去选定基线贡献后的差额。Top 3只按当前金额排，不计算涨幅。</p><p>独立教学示例：A贡献从0.10美元变为0.30美元，增加0.20美元；B从2.00美元变为2.05美元，只增加0.05美元。A当前金额仍小，但这次增加更多。不能用当前排名解释谁涨得最多。</p><p>分类成本占比上升，也不一定是分类成本金额增加，可能是其他类别成本下降使分母变小。比较变化必须同时明确前后配置、库存时点和相同计算范围。</p><p>当前未新增成本涨幅Top 3功能；如以后增加，需先确定比较最近保存草稿还是已发布版本，以及库存采用同一时点还是各自时点，不能由开发暗自选择基线。</p></div></details><h3 class=\"calc-detail-title\">逐项看：为什么展示、怎么算、高低代表什么、怎么用</h3>\n<details class=\"calc-detail\"><summary><span>概率怎么算</span><small>分类概率、权重、抽中概率</small></summary><div class=\"calc-detail-body\"><section class=\"calc-parameter\"><h4>分类概率</h4><p class=\"calc-ui-label\">Category probability</p><dl><div><dt>是什么</dt><dd>六个稀有度类别被抽中的概率。</dd></div><div><dt>怎么算</dt><dd>运营填写各分类的百分比，六个分类合计必须为100%。参与计算时转为小数，例如23%按0.23计算。</dd></div><div><dt>用于什么</dt><dd>先决定类别，再决定类内SKU；用于整个Box的概率。</dd></div><div><dt>异常处理</dt><dd>每项0–100%；正概率类别无有效SKU时阻止模拟/发布，不跨类别再分配。</dd></div><div><dt>为什么展示</dt><dd>说明每个稀有度分配到多少开盒机会，是SKU概率计算的前提，也能解释分类成本为什么高。</dd></div><div><dt>高低怎么看</dt><dd>某分类概率越高，该分类整体越常被抽中；越低则越少。没有哪一类天然应该越高越好。六类合计固定100%，提高一类必须相应降低其他类；从成本较低的类别转向成本较高的类别通常会增加整盒成本。</dd></div><div><dt>运营怎么用</dt><dd>用于配置各档奖品的出奖结构。应比较类别内按权重算出的平均进货成本，不能仅凭Common或Grail名称判断成本；改完看全Box成本与毛收益。Category类别本身是标签，没有数值高低评价。</dd></div></dl></section><section class=\"calc-parameter\"><h4>商品权重</h4><p class=\"calc-ui-label\">Weight</p><dl><div><dt>是什么</dt><dd>SKU的类内相对权重 / 同类可抽SKU权重总和。</dd></div><div><dt>怎么算</dt><dd>把同一分类内所有有库存、配置有效的商品权重加起来，得到该分类的可抽商品权重总和。</dd></div><div><dt>用于什么</dt><dd>调整同类别商品的相对机会；不等于最终概率，也不按库存量加权。</dd></div><div><dt>异常处理</dt><dd>权重必须是大于零的有限数值。库存为零的商品不参与求和；分类概率大于零却没有可抽商品时，配置不完整。</dd></div><div><dt>为什么展示</dt><dd>给运营一个可编辑的同类出奖频率控制项；无需手工凑各SKU概率为100%。</dd></div><div><dt>高低怎么看</dt><dd>同分类其他有效权重不变时，提高本SKU权重会提高其抽中概率（只有它可抽时概率不变），同时压低同类其他SKU的概率。没有越高或越低越好的标准；不同分类的权重不能直接比较。</dd></div><div><dt>运营怎么用</dt><dd>用于调节同类奖品的出奖结构。提高比该类当前平均采购成本更便宜商品的权重，会降低该类期望成本；提高更贵商品的权重则会增加成本。修改后看整盒重算结果。同类权重全乘相同倍数，概率不变。</dd></div></dl></section><section class=\"calc-parameter\"><h4>商品抽中概率</h4><p class=\"calc-ui-label\">Draw probability</p><dl><div><dt>是什么</dt><dd>一个SKU在整个Box每次抽奖中的命中概率。</dd></div><div><dt>怎么算</dt><dd>先用该商品的权重除以同分类可抽商品的权重总和，再乘以分类概率。库存为零时，该商品抽中概率为零。</dd></div><div><dt>用于什么</dt><dd>供运营确认最终抽中概率，用于成本期望、模拟和实际抽奖。</dd></div><div><dt>异常处理</dt><dd>分母覆盖同类全部有效SKU，不受Tab、搜索、分页影响。无效分母显示—，不静默按0继续发布。</dd></div><div><dt>为什么展示</dt><dd>把不直观的权重转成真实整盒中奖机会，便于核对出奖频率，也作为采购成本计算输入。</dd></div><div><dt>高低怎么看</dt><dd>高表示这个SKU更常被抽中，低表示更少被抽中；不直接表示好坏或盈利。概率为零表示当前不会抽中，不等于商品没有价值。</dd></div><div><dt>运营怎么用</dt><dd>用于确认运营想要的出奖频率。概率10%表示长期平均约每100抽出现10次，不保证每100抽恰好10次。结合进货价看成本贡献；调权重会同时改变同类其他SKU，不能只看这一行。</dd></div></dl></section></div></details><details class=\"calc-detail\"><summary><span>成本和收益怎么算</span><small>开盒价、采购比、成本贡献、整盒成本与毛收益</small></summary><div class=\"calc-detail-body\"><section class=\"calc-parameter\"><h4>开盒价格</h4><p class=\"calc-ui-label\">Open price</p><dl><div><dt>是什么</dt><dd>每次开盒向用户收取的价格，USD/抽。</dd></div><div><dt>怎么算</dt><dd>运营输入，必须&gt;0。</dd></div><div><dt>用于什么</dt><dd>作为收入端计算每抽毛收益；改价不改变抽中概率或进货成本。</dd></div><div><dt>异常处理</dt><dd>空、非数值、≤0阻止保存/发布。</dd></div><div><dt>为什么展示</dt><dd>提供收入侧比较基准，只有成本没有售价，无法判断采购成本是否被覆盖。</dd></div><div><dt>高低怎么看</dt><dd>奖池成本不变时，售价越高，每抽理论毛收益越高；但售价提高可能影响用户接受程度与购买量，不能因此认定总收益更高。越低则成本覆盖空间越小。</dd></div><div><dt>运营怎么用</dt><dd>用于与整盒理论成本比较。定价还要结合奖品吸引力和用户接受程度；本模型不估算需求变化，不自动给出最优售价。</dd></div></dl></section><section class=\"calc-parameter\"><h4>进货价 / 市场价</h4><p class=\"calc-ui-label\">Purchase / Market</p><dl><div><dt>是什么</dt><dd>进货价占市场价的比值，比例单位%。</dd></div><div><dt>怎么算</dt><dd>用商品进货价除以市场价，再转成百分比。例如进货价4美元、市场价6美元，进货价占市场价的66.67%。</dd></div><div><dt>用于什么</dt><dd>比较采购成本与市场定价；不是毛利率，不自动改变权重。</dd></div><div><dt>异常处理</dt><dd>市场价必须&gt;0；进货价允许0但不能为空、负数或非有限数。比值超过100%可显示，不自动拒绝。</dd></div><div><dt>为什么展示</dt><dd>把不同参考价商品的采购成本转成统一比例，帮助发现报价／录入异常；不是另一种利润指标。</dd></div><div><dt>高低怎么看</dt><dd>市场参考价可信且比较口径相同时，比例越低，采购成本占市场价越少，通常采购空间更大；越高，空间越小。超过100%表示采购价高于填入的市场参考价，不等于整盒必亏。</dd></div><div><dt>运营怎么用</dt><dd>用于检查采购性价比和价格录入。比如80%表示市场价每1美元对应采购支出0.80美元，剩下的20%不是开盒毛利率。最终盈利仍看整盒成本与开盒售价。</dd></div></dl></section><section class=\"calc-parameter\"><h4>商品每抽成本贡献</h4><p class=\"calc-ui-label\">Cost / draw</p><dl><div><dt>是什么</dt><dd>该SKU对每次开盒平均进货成本的贡献，USD/抽。</dd></div><div><dt>怎么算</dt><dd>用该商品的进货价乘以它在整个Box中的抽中概率。例如进货价4美元、抽中概率9.20%，每抽成本贡献为0.3680美元。</dd></div><div><dt>用于什么</dt><dd>解释哪个SKU增加整体成本，支持运营调权重和进货价。</dd></div><div><dt>异常处理</dt><dd>不用市场价代替进货价；不乘库存；SKU为0概率时贡献0。</dd></div><div><dt>为什么展示</dt><dd>把进货价和概率合成同口径的美元／抽，比较每个SKU实际占用的平均成本；只看商品单价会漏掉便宜但常出的商品。</dd></div><div><dt>高低怎么看</dt><dd>越高，表示这个SKU在整盒每抽平均采购成本中占的金额越大，是更主要的成本来源；越低，金额越小。它是成本贡献，不是利润贡献；高不等于坏，低不等于好。高值可能来自采购价高、抽中概率高，或两者共同作用。</dd></div><div><dt>运营怎么用</dt><dd>用于按成本影响排序排查。先核对进货价，再看该奖品是否值得安排当前出奖频率。不能直接判定应移除：降权或移除后，概率会转给同类其他商品，整盒成本可能下降也可能上升。修改后以整盒理论成本与毛收益为准。</dd></div></dl></section><section class=\"calc-parameter\"><h4>整盒理论每抽成本</h4><p class=\"calc-ui-label\">Expected cost / draw</p><dl><div><dt>是什么</dt><dd>全Box一次抽奖的理论平均采购成本，USD/抽。</dd></div><div><dt>怎么算</dt><dd>先算出每个商品的每抽成本贡献，再把六个分类的所有商品贡献相加。本节教学示例的合计为14.22725美元，界面显示14.23美元。</dd></div><div><dt>用于什么</dt><dd>与开盒价格比较，判断现有概率配置对应的成本。</dd></div><div><dt>异常处理</dt><dd>任一正概率类别不可抽时显示—。不能只加当前类别/当前页。</dd></div><div><dt>为什么展示</dt><dd>汇总整盒长期平均奖品采购支出，是判断配置成本的主指标；不会因只看某分类或某次随机模拟而改变。</dd></div><div><dt>高低怎么看</dt><dd>同一售价下，理论成本越低，预计采购支出越少、毛收益空间越大；越高则空间越小。但一味压低成本可能改变奖品体验，不是越低越好。低于售价表示标价可覆盖预计奖品采购成本；等于售价表示只在采购口径持平；高于售价表示预计毛亏损。</dd></div><div><dt>运营怎么用</dt><dd>这是判断当前奖池成本的主要指标，不必先运行模拟。先与开盒售价比较，成本偏高再展开各SKU成本贡献，调整后重新看整盒结果。它不是某一抽的实际成本，也不包含全部经营费用。</dd></div></dl></section><section class=\"calc-parameter\"><h4>理论每抽毛收益</h4><p class=\"calc-ui-label\">Expected gross profit / draw</p><dl><div><dt>是什么</dt><dd>未计运费、手续费等费用的每抽理论毛收益。</dd></div><div><dt>怎么算</dt><dd>用开盒售价减去整盒理论每抽成本。例如售价20美元、理论成本14.22725美元，理论毛收益为5.77275美元，界面显示5.77美元。</dd></div><div><dt>用于什么</dt><dd>用于快速检查售价是否覆盖预计采购成本。</dd></div><div><dt>异常处理</dt><dd>理论毛收益小于零时，标题和金额标红并显示Expected loss；大于或等于零时正常显示，无法计算时显示—。旧版离线原型不自动禁止发布；正式售卖以新增红字规则为准，整盒毛收益≤0时停售。不是净利润，也不保证单次盈利。</dd></div><div><dt>为什么展示</dt><dd>直接展示售价减采购成本后剩余多少，避免运营手动相减；与售价、理论成本一起解释收入基准、采购支出和余额三个不同问题。</dd></div><div><dt>高低怎么看</dt><dd>大于零：标价扣除预计奖品采购成本后还有余额；等于零：采购口径持平，没有空间覆盖其他费用；小于零：连预计奖品采购成本都无法覆盖。相同业务口径下越高，费用与波动的缓冲空间越大，但正数不代表净盈利或稳赚。</dd></div><div><dt>运营怎么用</dt><dd>用于判断整个Box的理论每抽毛收益。库存可抽集合变化后汇总所有分类，毛收益≤0时暂停整个Box新购买并通知运营；单SKU缺货不直接停售。旧版离线原型仅提醒，正式要求见新增红字说明。金额单位美元／抽；毛利率为该金额除以开盒售价，不用采购比代替。</dd></div></dl></section></div></details><details class=\"calc-detail\"><summary><span>库存与累计抽出</span><small>可用库存、Total drawn</small></summary><div class=\"calc-detail-body\"><section class=\"calc-parameter\"><h4>可用库存</h4><p class=\"calc-ui-label\">Available stock</p><dl><div><dt>是什么</dt><dd>当前Box分配给该SKU且可用于抽奖的数量。</dd></div><div><dt>怎么算</dt><dd>库存以服务端台账为准。Add是在当前库存上加上填写的数量；Remove是在当前库存中减去填写的数量。填写数量必须为正整数，真实抽出时由系统扣减库存。</dd></div><div><dt>用于什么</dt><dd>决定SKU是否可被抽取；支持运营补货。</dd></div><div><dt>异常处理</dt><dd>新SKU初值10,000；既有SKU不可因导入重置。禁止负数、小数；需要原子扣减和并发校验。</dd></div><div><dt>为什么展示</dt><dd>解释哪些SKU当前能够被抽到，也帮助识别库存归零导致的概率及成本变化。</dd></div><div><dt>高低怎么看</dt><dd>高表示可分配出奖件数更多，低表示更接近缺货，不代表概率更高或利润更好。当前库存数量不参与权重加权；从120变150不会改变概率，从正数变零才会退出抽取。</dd></div><div><dt>运营怎么用</dt><dd>用于补货和核对可履约数量，不能为了好看虚填库存。归零或恢复库存会触发同类重分配，之后应重新检查整盒成本；低价商品售罄有可能提高剩余奖池成本。没有新增固定低库存报警阈值。 页面分为剩余可抽和累计抽出两列，库存台账与抽奖计数各自独立。剩余可抽加累计抽出不代表初始库存，补货和人工减少都会使两者不同。</dd></div></dl></section><section class=\"calc-parameter\"><h4>累计抽出</h4><p class=\"calc-ui-label\">Total drawn</p><dl><div><dt>是什么</dt><dd>当前Box+SKU累计实际抽出的件数。</dd></div><div><dt>怎么算</dt><dd>来自真实完成抽奖事件的累计计数，非模拟次数。</dd></div><div><dt>用于什么</dt><dd>查看消耗历史与真实投放情况。</dd></div><div><dt>异常处理</dt><dd>只读，导入不回写，切版本不归零。撤销/退款是否冲减待订单规则确认。</dd></div><div><dt>为什么展示</dt><dd>提供实际出奖消耗的历史依据，用于核对库存；它与当前概率、模拟次数职责不同。</dd></div><div><dt>高低怎么看</dt><dd>高表示累计真实出奖更多，低表示较少；不能据此判断商品更受欢迎、更赚钱或当前概率更高。它同时受上线时长、历史概率、库存和Box总抽奖量影响。</dd></div><div><dt>运营怎么用</dt><dd>用于核对历史消耗和库存记录。比较不同SKU时要考虑统计时段和配置变更；累计值不能除以当前库存来推算抽中概率。模拟不会增加此数。</dd></div></dl></section></div></details><details class=\"calc-detail\"><summary><span>何时重算、显示精度与使用边界</span></summary><div class=\"calc-detail-body\"><h3>计算示例与显示精度</h3><p>Common类别23%，10个有效SKU权重和100。权重40的商品先用40除以100，再乘以分类概率23%，得到抽中概率9.20%。进货价4美元乘以9.20%，得到每抽成本贡献0.3680美元。Common全部SKU贡献$1.03845，其余五类合计$13.1888，整Box理论成本$14.22725。</p><p>金额通常显示2位小数；每抽SKU贡献显示4位；概率和采购比通常显示2位百分数；极低但非零的概率增加至4或6位，避免显示成0%。先用未舍入值计算，再格式化。单行显示相加可能不等于汇总显示，不用修改真实概率来凑显示值。导出计算列使用原始数值。</p><h3>重新计算与模拟失效</h3><p>类别概率、权重、SKU增删/改类、进货价及库存是否为0的变化会重算理论成本。开盒价仅重算毛收益；市场价仅重算采购比。上述影响模拟成本/收益的输入变化会使旧模拟过期。库存120→150不改变当前概率，但会改变动态模拟可运行路径，必须使旧模拟过期；120→0还必须重算当前概率。搜索、排序、分页不影响结果。保存未改变的配置不会使模拟过期。</p><h3>“卖完能赚多少”不是本次指标</h3><p>主页面按当前库存状态评估下一抽的期望采购成本；Run simulation另按模拟库存逐抽消耗，售罄后动态重算。市场价乘以抽中概率得到期望市场价值，不是平台采购成本；进货价乘以抽中概率才是成本贡献。动态模拟累计收入按实际完成抽数计算，并可能因整盒理论毛收益≤0或正概率分类售罄提前停止；本轮不模拟补货，不代表一定能卖完整批库存或实现相同收入。</p></div></details></div>",fields="<h2>保存边界</h2><p>奖池仅保留Add SKU与逐行编辑；导入、导出、模板下载入口均已移除。</p><p>当前编辑可取消；Save draft持久化未发布内容；Publish更新当前发布配置。库存调整为独立事务，取消编辑不回滚库存。Min Value和Max Value独立保存，在列表以Value range合并展示；正式用户前端读取发布后的两字段。</p><p>本交付为本地原型，不代表生产接口已完成。</p>",imagePipeline="<section class=\"image-guide\">\n<h2>商品图片 URL 输入</h2>\n<p class=\"stock-profit-rule\" style=\"color:#b42318\"><strong>2026-10-10 更新：</strong>新增和编辑 SKU 仅保留 Product image URL 必填输入框，移除本地文件上传区。运营先到外部网站上传图片、获取图片直链，再回到表单粘贴。上传网站暂未确定，按钮显示但禁用，不能跳到示例网站。</p>\n<h3>功能说明</h3>\n<p>商品图片来源仅通过 URL 填写，图片区域占一整行，不再并排展示上传框和URL框。标签为 Product image URL *；输入框提示为 https://example.com/image.png，此地址仅为输入格式示例。</p>\n<h3>交互逻辑</h3>\n<p>输入框下固定提示：Click the button below to upload your image to the image hosting website. Then copy the image URL and paste it above.</p>\n<p>下方按钮为 Upload image to get URL。网站尚未配置时禁用，旁边提示 Upload website not configured yet. You can still paste an existing image URL. 已有图片直链仍可正常填写。网站确定后统一配置，在新标签页打开，保留当前SKU表单输入，不在后台弹出本地文件选择器。</p>\n<p>点击 Add to current edits 或 Apply changes 时校验必填HTTPS图片直链，并下载可访问图片作为原型缓存。未修改的有效URL及已有图片可复用；替换URL读取失败时保留表单和原SKU，不提交半成品。成功仅应用到当前编辑，仍需保存草稿或发布。</p>\n<h3>异常状态</h3>\n<p>空URL、格式不正确或非HTTPS禁止提交；网页URL不是图片直链，不解析商品页。直链需返回PNG、JPEG或WebP，大小不超过5 MB。加载失败提示检查链接、网络及图片网站访问权限，不能再提示从本表单上传文件。加载期间防止重复提交；取消或切换表单后，旧请求不得写回新表单。</p>\n<h3>开发边界</h3>\n<p>新增与编辑SKU均要求有效URL。历史演示商品使用内嵌缩略图但没有真实URL，编辑提交时需填写图片直链，不伪造来源地址。Excel沿用Image URL列；旧版local-image引用仅为原型导出回导兼容。Box基本信息现也使用图片URL及Web／App视频URL，详见<a href=\"#box-media\">Box图片与视频URL</a>。</p>\n<p>网页和外部图片访问需要联网；原型受浏览器跨域策略限制，离线使用既有样例不受影响。目标上传网站、访问控制与生产图片存储接口待确认。此次不实现商品详情页取图或超分处理。</p>\n\n</section>",stockProfit="<section class=\"stock-profit-rule\" style=\"color:#b42318\">\n<h2>新增规则：整盒收益校验与自动停售</h2>\n<p><strong>已确认的正式开发要求。判断单位始终是整个 Box；单个 SKU 缺货只触发重算，不直接触发停售。以下新增说明全部标红。当前离线原型尚未接入真实抽奖服务、自动停售或系统通知。</strong></p>\n<h3>功能说明</h3>\n<p>汇总当前 Box 所有分类、所有可抽商品的概率与采购成本，判断整个 Box 是否具有正的理论每抽毛收益。不要求每个分类赚钱，也不要求每件商品被抽中时赚钱；理论平均收益为正不保证每次实际抽奖或每批订单盈利。本规则只计算奖品采购成本，不计手续费等其他费用。</p>\n<p><strong>整盒理论每抽成本＝Σ（每个可抽 SKU 的整盒中奖概率 × 采购成本）。<br>整盒理论每抽毛收益＝开盒售价 − 整盒理论每抽成本。<br>整盒理论毛利率＝整盒理论每抽毛收益 ÷ 开盒售价 × 100%。</strong></p>\n<p>例如 $5 Box：整盒平均成本 $4，则理论每抽毛收益 $1、毛利率 20%，可以继续销售；成本 $5，则毛收益与毛利率均为 0；成本 $6，则毛收益 −$1、毛利率 −20%。后两种情况均暂停销售。按未四舍五入的计算值判断，不以界面两位小数或随机模拟结果判断。</p>\n<h3>交互逻辑</h3>\n<ol>\n<li><strong>触发重算：</strong>真实抽奖扣库存或人工调整使 SKU 库存从正数变为 0 时，该商品保留记录、退出可抽集合、概率归零。只重算同分类剩余有货商品的概率，保留原权重与分类总概率；不均摊，不定向转给便宜商品，不跨分类分配。</li>\n<li><strong>汇总整盒：</strong>按已发布配置的售价、分类概率、权重和采购成本，结合最新有效库存，重新计算所有分类的成本总和及整盒毛收益、毛利率。当前 Tab、搜索、分页或未发布草稿不得影响线上判断。</li>\n<li><strong>毛收益 &gt; 0：</strong>在所有正概率分类均可抽取的前提下继续销售，并同步前台有效奖品及概率。单 SKU 缺货或某分类成本较高，均不能单独作为停售理由。</li>\n<li><strong>毛收益 ≤ 0：</strong>立即暂停整个 Box 的新购买，同时发送系统提醒；不等待运营查看或确认提醒才停售。保留配置、库存和历史记录，不删除 Box。</li>\n<li><strong>提醒与处理：</strong>提醒包含 Box 名称／ID、触发 SKU、原因、售价、重算后的整盒成本、毛收益、毛利率及发生时间，并提供该 Box 的处理入口。运营补货或调整配置后重新校验；所有正概率分类可抽且整盒毛收益 &gt; 0，方可由运营确认恢复上线，不自动恢复。</li>\n</ol>\n<h3>异常状态</h3>\n<p><strong>正概率分类全部缺货：</strong>原定抽奖规则无法完整执行，直接暂停整个 Box 并提醒，即使无法计算收益也不能继续销售。显示无法计算及具体原因，不伪造零成本、零收益，不将该分类概率转给其他分类。</p>\n<p><strong>已确认购买的订单：</strong>按购买时锁定的概率版本和规则处理，不套用后续新概率。用户确认购买前若有效概率已变化，更新展示并要求重新确认。已受理订单的履约或退款异常处理由订单服务落实，不能静默换奖或重抽。</p>\n<h3>开发验收与边界</h3>\n<p>服务端应协调库存扣减、有效概率更新、整盒收益校验与售卖状态，确保库存变化后的新订单不能使用旧的可售结果。后台列表状态与前台购买入口同步；通知失败不得导致恢复销售，通知需记录失败并重试。补货、发布生效及恢复上线同样校验最新有效配置，不能绕过整盒毛收益 &gt; 0 的可售条件；未发布草稿不影响线上。</p>\n<p>验收至少覆盖：单 SKU 缺货但整盒仍盈利时继续销售；其他分类仍有货但整盒毛收益为零／负数时停售；正概率分类全部缺货时停售；补货后重新校验并人工恢复；并发购买不能绕过停售；停售不改写已确认订单的规则。</p>\n<p><strong>原型差异：</strong>已有“亏损仅提醒、仍可发布／上线”的截图及交互仅代表旧版离线演示，不作为正式可售规则；正式售卖与恢复上线以本节为准。通知渠道和接口实现待后端对接。本次仅补充说明，未实现自动停售服务。</p>\n</section>\n",dynamicSimulation="<section class=\"stock-profit-rule\" style=\"color:#b42318\">\n<h3>已更新：动态库存模拟</h3>\n<p>Run simulation现在复制整个Box的当前配置与准确库存，最多运行100,000抽。每抽扣减对应SKU的一份模拟库存；售罄后保留原权重、重算同分类概率，再汇总整个Box的理论收益。</p>\n<p>开始前及每次售罄重算后检查：整盒理论每抽毛收益≤0，或正概率分类全部缺货，立即结束模拟并说明原因；否则继续到抽数上限。单SKU缺货但整盒仍可抽且理论盈利时继续。停售依据是下一抽的理论收益，不是已经累计赚了多少钱。</p>\n<p>结果展示完成／计划抽数、停止原因、累计模拟收入、累计奖品成本、累计模拟毛收益、平均每抽毛收益、结束时理论每抽毛收益及毛利率，并列出本轮售罄SKU和售罄发生的抽数。0抽时累计为0、平均为—；正概率分类售罄导致理论值无法计算时显示—。</p>\n<p>任意库存数量变化都会使旧模拟结果过期。本轮不模拟补货；真实库存、Total drawn和Box上线状态均不改变，也不发送生产停售通知。动态模拟已实现；正式自动停售与通知服务仍待接入。旧固定概率模拟截图不再展示，请通过本页“打开对应交互状态”查看新版结果。</p>\n</section>\n";function renderFieldSpecs(key){const groups=fieldSpecs[key];if(!groups)return '';return `<section class="field-specs"><h3>字段定义 · 与界面逐项对应</h3><p class="field-specs-intro">每项标明填写或读取来源、计算方法、校验与保存；所有字段补充为什么展示；数值指标另说明高低的含义及运营用途，不把数值大小直接等同好坏。点击分组可展开其他字段。计算字段只读：前端提供实时预览，服务端保存／发布时重新校验计算，不能直接信任上传的计算结果。</p>${groups.map((g,i)=>`<details class="field-group" ${key!=='pool'||i===1||i===2?'open':''}><summary>${g.title}（${g.fields.length}项）</summary>${g.fields.map(f=>`<section class="field-definition"><h4>${f.label}</h4><span class="field-kind">${f.kind}</span><dl><div><dt>含义</dt><dd>${f.meaning}</dd></div><div><dt>为什么展示</dt><dd>${f.purpose}</dd></div><div><dt>来源／编辑</dt><dd>${f.source}</dd></div><div><dt>计算／更新</dt><dd>${f.calculation}</dd></div><div><dt>校验／保存</dt><dd>${f.rules}</dd></div>${f.reading?`<div><dt>高低怎么看</dt><dd>${f.reading}</dd></div><div><dt>运营怎么用</dt><dd>${f.action}</dd></div>`:''}</dl></section>`).join('')}</details>`).join('')}</section>`}function render(){const key=location.hash.slice(1)||'dashboard',i=pages.findIndex(x=>x.key===key),p=pages[i];document.querySelector('#nav').innerHTML=`<button class="${key==='dashboard'?'active':''}" onclick="location.hash='dashboard'">数据看板 / 参数定义</button><hr>`+pages.map((p,j)=>`<button class="${key===p.key?'active':''}" onclick="location.hash='${p.key}'">${String(j+1).padStart(2,'0')} ${p.title}</button>`).join('')+`<hr><button class="${key==='box-media'?'active':''}" onclick="location.hash='box-media'">Box 图片与视频 URL</button><button class="${key==='sku-warnings'?'active':''}" onclick="location.hash='sku-warnings'">SKU 价格与库存提醒</button><button class="${key==='stock-profit'?'active':''}" style="color:#b42318" onclick="location.hash='stock-profit'">新增：整盒收益与停售</button><button class="${key==='image-pipeline'?'active':''}" onclick="location.hash='image-pipeline'">商品图片 URL 输入</button><button class="${key==='calculations'?'active':''}" onclick="location.hash='calculations'">概率与成本说明</button><button class="${key==='fields'?'active':''}" onclick="location.hash='fields'">导入字段 / 开发边界</button>`;const el=document.querySelector('#content');if(!p){el.innerHTML='<article class="article">'+(key==='dashboard'?dashboard:key==='box-media'?boxMedia:key==='sku-warnings'?skuWarnings:key==='stock-profit'?stockProfit:key==='image-pipeline'?imagePipeline:key==='fields'?fields:formula)+'</article>';window.scrollTo(0,0);return}el.innerHTML=`<div class="sectionhead"><div><h2>${String(i+1).padStart(2,'0')} ${p.title}</h2><p>${p.scene}</p></div><a target="_blank" href="ui.html?scene=${p.key}">打开对应交互状态 ↗</a></div><div class="spread" ${['simulation-running','simulation-result','add','edit','create','basic','probability-error'].includes(p.key)?'style="grid-template-columns:minmax(0,900px)"':''}><figure ${['simulation-running','simulation-result','add','edit','create','basic','probability-error'].includes(p.key)?'hidden':''} class="visual" style="margin:0"><img src="${p.image}" alt="${p.title}英文UI" onclick="zoom(this)"><footer><span>实现页面截图 · 点击放大</span><a href="${p.image}" download>下载 PNG</a></footer></figure><article class="description"><h3>功能说明</h3><p>${p.function}</p>${['pool','add','edit','import','import-error','import-ready','export'].includes(p.key)?'<p><a href="#image-pipeline">商品图片 URL：先到网站上传，再复制直链回填 →</a></p>':''}${['boxes','pool','stock','stock-impact','loss-publish','offline','publish'].includes(p.key)?'<p class="stock-profit-note"><strong>新增正式规则：</strong>单 SKU 缺货后重算同类概率，再汇总整个 Box；整盒理论每抽毛收益 ≤ 0 时立即停售并通知运营。正概率分类全部缺货同样停售。当前原型未接入自动停售服务。<a href="#stock-profit">查看完整红字说明 →</a></p>':''}${['simulation-running','simulation-result'].includes(p.key)?dynamicSimulation:''}${['add','edit'].includes(p.key)?'<p class="stock-profit-note"><a href="#sku-warnings">新版价格与库存提醒：规则及交互演示 →</a><br>图片录入已改为仅输入URL。请先到外部网站上传获取直链，再回来粘贴。网站待确定，按钮暂禁用；本页旧上传截图已停用，点击“打开对应交互状态”查看新版表单。</p>':''}${['create','basic','probability-error'].includes(p.key)?'<p><a href="#box-media">Box媒体已改为图片URL、Web／App开盒视频URL；旧上传截图已停用。查看规则与新版设计 →</a></p>':''}${renderFieldSpecs(p.key)}<h3>交互逻辑</h3><p>${p.interaction}</p><h3>异常状态</h3><p>${p.exception}</p>${p.check?'<h3>开发验收 / 边界</h3><p>'+p.check+'</p>':''}<p style="margin-top:20px"><a href="#calculations">查看参数含义、计算方法、用途与异常处理 →</a></p></article></div><div class="pager"><button ${i===0?'disabled':''} onclick="location.hash='${pages[Math.max(0,i-1)].key}'">← 上一页</button><span class="muted">${i+1} / ${pages.length}</span><button ${i===pages.length-1?'disabled':''} onclick="location.hash='${pages[Math.min(pages.length-1,i+1)].key}'">下一页 →</button></div>`;window.scrollTo(0,0)}function zoom(el){document.querySelector('#zoom img').src=el.src;document.querySelector('#zoom').showModal()}addEventListener('hashchange',render);render();</script></body></html>
