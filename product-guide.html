r", "title": "概率校验失败", "scene": "创建或保存时六类比例不是100%，图示总和99%。", "function": "显示实时合计；错误时明确说明当前总和与必须达到的100%。", "interaction": "阻止创建、保存和发布；将焦点移至第一个错误字段或概率区域。修改后重新校验；不自动按比例修正用户输入。", "exception": "空值、负数、超过100、非数值均是错误。不能把空值当作已填写的0。采用十进制精度校验，避免浮点误差误判。", "check": "图中99%的错误提示对应实际六项输入；正常100%显示成功状态。输入精度由接口统一，当前HTML示例支持0.01%。", "image": "screens/03-probability-error.png?v=1791791666346529663"}, {"key": "basic", "title": "编辑基本信息", "scene": "从 Edit 或 Basic information 标签进入。", "function": "编辑名称、价格、图片URL、Web／App开盒视频URL和六类概率；修改与奖池共用一个 Box 的当前编辑状态。 增加Displayed value range：Min Value和Max Value两个必填USD输入，手动配置前端展示范围；不从SKU市场价推导。", "interaction": "标签切换保留未保存内容。价格修改只影响每抽毛收益；类别概率修改会重算全 Box 抽中概率和期望成本。底部 Cancel / Save draft / Publish 对整个 Box 生效。 范围随创建/保存草稿持久化，发布后供前端使用；取消恢复最近保存值。", "exception": "同创建页校验。价格与图片未就绪不能提交。当前有正概率类别但还没有 SKU，可以保存合法字段的草稿；发布时必须补全。 两值必须非负、最多2位小数，Min Value不能大于Max Value；相等及0允许，空值不能当0，详细上限见字段定义。", "check": "保存基本信息时必须同时保存当前奖池编辑内容，不能因切换标签遗漏另一页的修改。", "image": "screens/04-basic.png?v=1791791666563256183"}, {"key": "pool", "title": "奖池配置主页面", "scene": "运营查看数据、调权重和评估整个 Box 的成本。", "function": "上方经济指标始终覆盖整个 Box；分类标签仅筛选表格。每抽预计毛收益<0时，标题及金额标红，并显示Expected loss；≥0恢复正常，无法计算时显示—且不报亏损。指标下方不显示Before shipping and fees文案，费用口径保留在计算字典。保留 Product → Pricing → Probability & cost → Inventory 四组灰色表头；价格紧邻权重、抽中概率和每抽成本，右侧Inventory分为Stock remaining（剩余可抽）与Total drawn（累计抽出）两列，每格只显示数值，零库存另标Out of stock。库存列保留表头升降序排序，用于定位缺货和库存少的SKU；累计抽出仅作历史参考，不提供排序。取消独立排序下拉框及单元格内重复文案，行操作仍在末尾。剩余加累计抽出不定义为初始或总库存：中间可能存在补货、人工减库存。Excel保持两个独立字段。分类标签上方仅保留Add SKU。Import、Export和空池Download template入口均移除。", "interaction": "仅六类标签，无 All；默认 Common。搜索当前分类名称或 SKU；切分类清空搜索并回第一页，不清空修改。价格、概率／成本及剩余库存列支持表头排序，累计抽出不排序；范围为筛选后全部记录。20/50/100条每页。权重直接在表内编辑，合法输入时立即重算；不显示旧权重。", "exception": "权重为空、≤0或非有限数时不能计算有效结果或提交。库存0的SKU保留显示，概率为0。任一正概率类别没有有效SKU，全 Box成本显示 —，不可运行模拟或发布。", "check": "任何筛选、排序或分页不能改变计算分母。当前页全部 SKU 随内容向下展开，不限制列表高度；使用整页纵向滚动，窄窗口仅表格横向滚动。底部分页可随页面滚动到达，全局操作栏不遮挡最后一行。", "image": "screens/05-pool.png?v=1791791666761891212"}, {"key": "empty", "title": "空奖池", "scene": "新 Box 创建成功或当前类别尚未添加商品。", "function": "全Box无商品时仅显示Add SKU。开盒价格保留；理论成本与毛收益显示 —。", "interaction": "Add SKU 打开居中表单并明确选择 Category。不再提供导入、导出或模板下载入口。", "exception": "全奖池空不能模拟或发布。当前分类搜索无结果时提示 No matching SKUs，不误导用户以为奖池被清空。", "check": "空类别允许继续编辑其他类别；不自动改变分类概率。", "image": "screens/06-empty.png?v=1791791666942836165"}, {"key": "add", "title": "添加 SKU", "scene": "点击全 Box 工具栏 Add SKU。", "function": "居中弹窗，不提供 Existing SKU / New SKU 切换。填写名称、分类、图片、市场价、进货价、权重；初始库存默认10,000，可修改。SKU ID自动生成、不可填写。选择Category后，显示当前Box对应的Market price range（含上下限）；切换分类即时更新。四个已有Box用原表各自范围，新Box无范围资料则隐藏，不按相同售价自动套用。", "interaction": "商品图片仅输入Product image URL。先通过外部网站上传获取图片直链，再复制粘贴。上传网站待配置，入口按钮暂禁用；已有直链可用。表单没有本地文件上传入口。Purchase / Market 自动计算。Add to current edits 校验通过后加入当前编辑内容并定位所选分类，重算概率；尚未保存或发布。首次保存/发布时生成稳定ID。", "exception": "名称、分类、图片、价格与权重必填；市场价>0，进货价≥0，权重>0；初始库存为非负整数。图片URL读取失败保留表单并要求修正直链，不提示本地上传。", "check": "新建商品库存只属于当前Box。草稿中的临时SKU不能产生真实抽奖或全局库存调整。市场价低于建议下限或高于建议上限时输入框及文案标红，边界值属于区间内；点击Add to current edits／Apply changes时弹出Confirm market price二次确认，Keep editing、关闭或Esc保留表单，Add anyway／Apply anyway仅应用当前编辑，不保存或发布。市场价>100美元且库存>50时，库存下方额外显示黄色文字High-value inventory risk，提示复核进货价和抽中概率；两个条件必须同时满足，不阻止提交。旧版表单截图不作为当前图片输入方式的依据。", "image": "screens/07-add.png?v=1791791667114046124"}, {"key": "edit", "title": "编辑 SKU", "scene": "行尾三个点选择 Edit。", "function": "弹窗展示完整商品名、当前分类、图片、价格、权重与只读SKU ID。库存显示只读，使用独立 Adjust stock 调整。", "interaction": "Apply changes 仅写入当前编辑状态；改分类时同时重算原类别与新类别。取消或关闭弹窗不提交其中的修改。分类市场价参考范围随Category切换，规则与新增一致；不自动改价格；超区间标红并在提交时二次确认，确认后仍可应用。当前列表定位到修改后的类别。", "exception": "输入规则与新增相同。更换图片URL需重新读取有效图片；成功提交前保留原SKU图片。失败不得静默保留错误链接并提交。SKU ID不允许改变。", "check": "同一商品在多个 Box 中的配置和库存互不联动。本期没有共享库存逻辑。", "image": "screens/08-edit.png?v=1791791667315764900"}, {"key": "stock", "title": "调整库存", "scene": "行菜单选择 Adjust stock。", "function": "先明确选择 Add stock 或 Remove stock；默认 Add stock，数量留空。只输入正整数，不需要填写正负号。并排展示 Current stock → Stock after change，下方显示如120 + 30 = 150的计算式。", "interaction": "确认按钮根据操作与数量显示 Add 30 units 或 Remove 30 units；减库存按钮使用红色 · 商品名称", "kind": "运营填写", "meaning": "识别奖品的完整名称，文本字段。", "source": "新增或编辑 SKU 弹窗填写，也可通过导入新增或更新；列表只读。", "calculation": "不计算。表格最多显示两行，悬停或聚焦查看完整名称，不能把截断后的文字保存回去。", "rules": "必填，去掉首尾空白后不能为空。弹窗确认先应用到当前编辑，保存草稿或发布后才持久化。", "purpose": "让运营核对正在配置的是哪件奖品，避免长名称截断或同名商品造成误操作。"}, {"label": "Product image URL · 商品图片链接", "kind": "运营填写", "meaning": "新增和编辑SKU仅输入图片URL，不提供本地图片上传。", "source": "先点击Upload image to get URL前往外部网站上传，复制图片直链回填；网站待确定，按钮暂禁用，已有直链可填写。", "calculation": "填写HTTPS图片直链，提交时校验并读取图片；成功后与SKU关联，原型缓存可用图片。", "rules": "必填；空值、非HTTPS或不可读取图片不得提交。加载失败保留其他输入，不回退到上传文件。原演示SKU缺少URL时编辑需补填；Box媒体输入规则见Box media章节。", "purpose": "让运营从商品包装确认款式，并为用户展示奖品；图片处理成功不替代商品身份核对。"}, {"label": "SKU ID · 商品配置编号", "kind": "系统生成", "meaning": "标识当前 Box 中的 SKU 配置，用于编辑、导入匹配及关联库存和抽奖历史。", "source": "首次成功保存草稿或发布时生成稳定 ID，运营不可填写或修改；保存前显示 Assigned on save。", "calculation": "不从商品名称计算；后端生成并保证唯一性，具体编码规则待接口约定。同一商品加入其他 Box 后配置与库存独立。", "rules": "导入空 ID 表示新增；非空 ID 只能匹配当前 Box 中已有 SKU。重复、未知或跨 Box 的 ID 拒绝；移除配置不删除历史关联。", "purpose": "为编辑、导入更新和历史记录提供稳定匹配依据；名称可变，不能承担这个职责。"}]}, {"title": "Pricing · 价格", "fields": [{"label": "Market price · 市场价", "kind": "运营填写", "meaning": "该商品用于运营对比的市场参考价，单位美元／件。不是平台实际采购成本。", "source": "在 SKU 新增／编辑弹窗或导入文件中填写；列表只读，不自动抓取实时行情。", "calculation": "本字段不计算；修改后重算 Purchase / Market。它不直接改变权重、抽中概率或理论每抽成本。", "rules": "必填、大于零且为有限数值；界面显示两位小数。新增／编辑表单超分类建议范围时标红，提交需二次确认，确认后允许应用；市场价>100美元且库存>50时额外黄字提醒。应用到当前编辑后需保存或发布。正式金额输入与存储精度需接口统一，不能只靠前端显示约束。", "reading": "高表示商品的市场参考价值较高，低表示较低；没有统一的越高越好。市场价不等于平台收入，也不直接进入采购成本计算。", "action": "用于核对奖品定位和进货价是否合理。先确认同款、同版本与同成色的参考价；不能通过抬高市场价让奖池看起来更赚钱。", "purpose": "给奖品的市场参考价值提供背景，并作为采购比的分母；不能单独证明平台盈利。"}, {"label": "Purchase cost · 进货价", "kind": "运营填写", "meaning": "平台获得一件该商品的采购成本，单位美元／件；用于奖池成本核算。", "source": "在 SKU 新增／编辑弹窗或导入文件填写；列表只读。", "calculation": "本字段不自动从市场价推算。修改后重算采购比、该商品成本贡献、整盒成本与毛收益，并使旧模拟结果过期。", "rules": "必填、允许零，不允许负数、空值或非有限数值。样例的“市场价85%”只是造数据假设，不是生产默认值或强制规则。", "reading": "同一商品、同等质量与供货条件下，进货价越低越有利于成本；越高，每次抽中它的采购支出越大。不同奖品不能只按进货价高低判断好坏。", "action": "用于核对采购报价。若这个SKU的概率大于零，降低进货价会降低整盒成本；不要把不准确的低价填入系统来消除亏损提醒。", "purpose": "说明真实采购支出的输入来源；不展示这个值，就难以判断成本贡献高是采购价高还是概率高。"}, {"label": "Purchase / Market · 进货价占市场价比例", "kind": "系统计算", "meaning": "采购成本占市场参考价的百分比，用于比较采购价格，不是毛利率。", "source": "只读；输入来自当前编辑中的 Purchase cost 与 Market price，不能直接填写。", "calculation": "用进货价除以市场价，再转成百分比。例如进货价4美元、市场价5美元，显示80.00%。两项价格变化时立即重算。", "rules": "通常显示两位百分数。价格缺失或非法时显示—；市场价为零不能相除。超过100%允许显示，不自动改权重；导入计算列不采信上传值。", "reading": "市场参考价可信且比较口径相同时，比例越低，采购成本占市场价越少，通常采购空间更大；越高，空间越小。超过100%表示采购价高于填入的市场参考价，不等于整盒必亏。", "action": "用于检查采购性价比和价格录入。比如80%表示市场价每1美元对应采购支出0.80美元，剩下的20%不是开盒毛利率。最终盈利仍看整盒成本与开盒售价。", "purpose": "把不同参考价商品的采购成本转成统一比例，帮助发现报价／录入异常；不是另一种利润指标。"}]}, {"title": "Probability & cost · 概率与成本", "fields": [{"label": "Weight · 类内权重", "kind": "运营填写", "meaning": "同一分类内商品的相对中奖机会。它不是百分比，也不是库存件数。", "source": "新增／编辑SKU、导入或表格行内填写；允许正小数，无需凑成100。新SKU权重为空，必须填写。", "calculation": "先把同一分类中所有有库存且配置合法商品的权重相加，再用各商品权重计算类内占比。权重输入合法时立即重算概率、成本和收益，旧模拟过期。", "rules": "必须是大于零的有限数值。空值或非法值不按零处理；标错、计算结果显示—，保存／发布校验不通过。行内修改只属于未保存编辑，不立即改变线上权重。", "reading": "同分类其他有效权重不变时，提高本SKU权重会提高其抽中概率（只有它可抽时概率不变），同时压低同类其他SKU的概率。没有越高或越低越好的标准；不同分类的权重不能直接比较。", "action": "用于调节同类奖品的出奖结构。提高比该类当前平均采购成本更便宜商品的权重，会降低该类期望成本；提高更贵商品的权重则会增加成本。修改后看整盒重算结果。同类权重全乘相同倍数，概率不变。", "purpose": "给运营一个可编辑的同类出奖频率控制项；无需手工凑各SKU概率为100%。"}, {"label": "Draw probability · 整盒抽中概率", "kind": "系统计算", "meaning": "每次开启这个 Box 时抽中该 SKU 的概率，用于实际抽奖、成本计算和模拟。", "source": "只读；读取当前分类概率、该商品权重、同分类所有有效商品权重与库存。", "calculation": "该商品权重除以同分类有库存商品的权重总和，再乘以分类概率。例如分类20%、商品权重1、类内总权重4，整盒抽中概率为5%。", "rules": "库存为零则概率为零；原概率按剩余权重在同分类重分配，分类总概率不变。补货恢复参与。搜索、排序、分页不影响分母。正概率分类无可抽SKU时整盒结果不可用，阻止模拟／发布；不跨分类分摊。极小非零概率增加显示精度。", "reading": "高表示这个SKU更常被抽中，低表示更少被抽中；不直接表示好坏或盈利。概率为零表示当前不会抽中，不等于商品没有价值。", "action": "用于确认运营想要的出奖频率。概率10%表示长期平均约每100抽出现10次，不保证每100抽恰好10次。结合进货价看成本贡献；调权重会同时改变同类其他SKU，不能只看这一行。", "purpose": "把不直观的权重转成真实整盒中奖机会，便于核对出奖频率，也作为采购成本计算输入。"}, {"label": "Cost / draw · 商品每抽成本贡献", "kind": "系统计算", "meaning": "该 SKU 给整个 Box 每抽平均采购成本带来的金额，单位美元／抽。用于找出主要成本来源。", "source": "只读；读取该商品进货价及整盒抽中概率，不接受手工输入或导入覆盖。", "calculation": "用进货价乘以整盒抽中概率。例如进货价4美元、概率5%，成本贡献为每抽0.2000美元。价格或概率改变时重算。", "rules": "显示四位小数。合法零概率贡献为零；配置非法时显示—。不乘库存件数、不用市场价代替进货价，也不代表该商品的利润。", "reading": "越高，表示这个SKU在整盒每抽平均采购成本中占的金额越大，是更主要的成本来源；越低，金额越小。它是成本贡献，不是利润贡献；高不等于坏，低不等于好。高值可能来自采购价高、抽中概率高，或两者共同作用。", "action": "用于按成本影响排序排查。先核对进货价，再看该奖品是否值得安排当前出奖频率。不能直接判定应移除：降权或移除后，概率会转给同类其他商品，整盒成本可能下降也可能上升。修改后以整盒理论成本与毛收益为准。", "purpose": "把进货价和概率合成同口径的美元／抽，比较每个SKU实际占用的平均成本；只看商品单价会漏掉便宜但常出的商品。"}]}, {"title": "Inventory · 剩余与累计抽出", "fields": [{"label": "Stock remaining / Available stock / Initial stock · 剩余可抽／初始库存", "kind": "系统读取／新增可填", "meaning": "当前 Box 分配给该 SKU、可用于抽奖的件数，非负整数。", "source": "新增时 Initial stock 默认10,000，可手动修改；已保存 SKU 的 Available stock 来自独立库存台账，在列表独立的Stock remaining列显示，编辑弹窗仍用Available stock且只读。", "calculation": "已有库存用 Adjust stock 调整：Add加上输入数量，Remove减去输入数量；真实完成抽奖由库存服务扣减。库存为零时退出计算，补货后按原权重恢复。", "rules": "新增／编辑SKU中，市场价>100美元且库存>50时额外显示黄色风险文字，提醒复核采购成本与抽中概率，不阻止提交；100美元或50件的边界不触发。已有库存调整确认后立即生效，不等待发布，也不随取消配置或修改配置回滚。导入只接受新SKU的初始库存；现有库存不回写。并发扣减、防重和锁由后端实现。", "reading": "高表示可分配出奖件数更多，低表示更接近缺货，不代表概率更高或利润更好。当前库存数量不参与权重加权；从120变150不会改变概率，从正数变零才会退出抽取。", "action": "用于补货和核对可履约数量，不能为了好看虚填库存。归零或恢复库存会触发同类重分配，之后应重新检查整盒成本；低价商品售罄有可能提高剩余奖池成本。没有新增固定低库存报警阈值。 页面分为剩余可抽和累计抽出两列，库存台账与抽奖计数各自独立。剩余可抽加累计抽出不代表初始库存，补货和人工减少都会使两者不同。", "purpose": "解释哪些SKU当前能够被抽到，也帮助识别库存归零导致的概率及成本变化。"}, {"label": "Total drawn · 累计抽出", "kind": "系统读取", "meaning": "当前 Box 中该 SKU 累计被真实抽奖抽出的件数；不是已发货数量，不含人工减库存或模拟。", "source": "读取真实抽奖记录／计数台账；新 SKU 为零。运营不可填写、编辑或通过导入覆盖。", "calculation": "每次真实完成且幂等确认的抽奖按实际出奖件数累计；模拟抽奖不累计，修改配置不清零。", "rules": "只读非负整数；当前样例数字是模拟历史，不是真实订单。取消订单或退款是否冲减，待订单业务规则确认。", "reading": "高表示累计真实出奖更多，低表示较少；不能据此判断商品更受欢迎、更赚钱或当前概率更高。它同时受上线时长、历史概率、库存和Box总抽奖量影响。", "action": "用于核对历史消耗和库存记录。比较不同SKU时要考虑统计时段和配置变更；累计值不能除以当前库存来推算抽中概率。模拟不会增加此数。", "purpose": "提供实际出奖消耗的历史依据，用于核对库存；它与当前概率、模拟次数职责不同。"}, {"label": "Stock alert · 库存告警开关", "kind": "运营填写", "meaning": "是否为当前Box的当前SKU启用按剩余数量判断的库存告警。", "source": "新增默认Off；旧数据无字段按Off处理，编辑读取stockAlertEnabled。", "calculation": "Off不判断告警且隐藏阈值；On显示必填阈值，不预填任何数字。", "rules": "Apply changes仅应用当前编辑；Save draft保存草稿；Publish后成为已发布规则。取消弹窗不修改配置。关闭并应用时清空已保存阈值，不影响库存、概率、收益或模拟。", "purpose": "让运营按需为单个奖品启用告警，避免默认全量开启。"}, {"label": "Alert threshold (units) · 库存告警阈值", "kind": "运营填写", "meaning": "剩余可抽库存达到此数量或更少时提示，单位件；不是百分比或累计抽出数量。", "source": "仅On时必填stockAlertThreshold；由运营输入，无默认值。", "calculation": "启用且Stock remaining≤阈值时显示Low stock；补货至大于阈值后清除。0合法，表示库存耗尽时告警；阈值可高于当前库存，应用后立即显示当前配置预览。", "rules": "必须为0至9,007,199,254,740,991的整数；空值、小数、负数、非数值不通过。无效时禁用提交，非法非空输入显示Enter a whole number of 0 or more for the stock alert threshold. 保存／发布再次校验。", "purpose": "用明确剩余件数提醒补货，阈值由运营按奖品单独决定。"}]}, {"title": "页面顶部与分类信息", "fields": [{"label": "Open price · 开盒售价", "kind": "运营填写／本页读取", "meaning": "用户开一次 Box 的标价，单位美元／抽，用于计算预计毛收益。", "source": "在 Basic information 填写；奖池页只读，显示当前编辑中的价格。", "calculation": "本字段不计算；修改售价只重算毛收益并使旧模拟过期，不改变抽中概率和采购成本。", "rules": "新建Box为空；必填、大于零且为有限数值。显示两位小数。保存草稿不影响线上售价，发布后才更新已发布配置；它不是扣除优惠后的实际实收。", "reading": "奖池成本不变时，售价越高，每抽理论毛收益越高；但售价提高可能影响用户接受程度与购买量，不能因此认定总收益更高。越低则成本覆盖空间越小。", "action": "用于与整盒理论成本比较。定价还要结合奖品吸引力和用户接受程度；本模型不估算需求变化，不自动给出最优售价。", "purpose": "提供收入侧比较基准，只有成本没有售价，无法判断采购成本是否被覆盖。"}, {"label": "Expected cost / draw · 理论每抽成本", "kind": "系统计算", "meaning": "整个 Box 长期平均每抽的预计采购成本，单位美元／抽，用于判断奖品成本。", "source": "只读；汇总整个 Box 六类中的全部商品，不能只计算当前分类或当前页。", "calculation": "逐个计算商品进货价乘以整盒抽中概率，再把全部商品的成本贡献相加。权重、分类概率、进货价、增删或改类，以及库存跨越零时重算；不需要先运行模拟。", "rules": "显示两位小数，汇总使用未舍入值。任一正概率分类无有效商品或计算字段非法时显示—，不把缺失成本当零。点击可查看成本来源。", "reading": "同一售价下，理论成本越低，预计采购支出越少、毛收益空间越大；越高则空间越小。但一味压低成本可能改变奖品体验，不是越低越好。低于售价表示标价可覆盖预计奖品采购成本；等于售价表示只在采购口径持平；高于售价表示预计毛亏损。", "action": "这是判断当前奖池成本的主要指标，不必先运行模拟。先与开盒售价比较，成本偏高再展开各SKU成本贡献，调整后重新看整盒结果。它不是某一抽的实际成本，也不包含全部经营费用。", "purpose": "汇总整盒长期平均奖品采购支出，是判断配置成本的主指标；不会因只看某分类或某次随机模拟而改变。"}, {"label": "Expected gross profit / draw · 理论每抽毛收益", "kind": "系统计算", "meaning": "按开盒标价扣除预计奖品采购成本后，每抽平均剩余的金额，单位美元／抽。", "source": "只读；读取当前开盒售价和整盒理论每抽成本。", "calculation": "开盒售价减去理论每抽成本。售价20美元、理论成本16.31美元时，显示约3.69美元；任一输入变化时重算。", "rules": "小于零时标题及金额标红并显示 Expected loss；等于零不标亏损，无法计算显示—。旧版离线原型仅提醒、不自动禁止发布；正式售卖按新增红字说明，整盒理论每抽毛收益≤0时停售并通知运营；未扣运费、支付手续费、折扣等，不是净利润或百分比。", "reading": "大于零：标价扣除预计奖品采购成本后还有余额；等于零：采购口径持平，没有空间覆盖其他费用；小于零：连预计奖品采购成本都无法覆盖。相同业务口径下越高，费用与波动的缓冲空间越大，但正数不代表净盈利或稳赚。", "action": "用于判断整个Box的理论每抽毛收益。库存可抽集合变化后汇总所有分类，毛收益≤0时暂停整个Box新购买并通知运营；单SKU缺货不直接停售。旧版离线原型仅提醒，正式要求见新增红字说明。金额单位美元／抽；毛利率为该金额除以开盒售价，不用采购比代替。", "purpose": "直接展示售价减采购成本后剩余多少，避免运营手动相减；与售价、理论成本一起解释收入基准、采购支出和余额三个不同问题。"}, {"label": "Category / Rarity probabilities · 分类与分类概率", "kind": "运营填写／奖池页读取", "meaning": "SKU属于六个稀有度中的哪一类；分类概率表示每次开盒抽中这一类的机会。", "source": "SKU弹窗选择Category，新增不预选。六类概率在Basic information填写；奖池页Category probability只读显示所选分类的配置值。", "calculation": "类别本身不计算。商品按所属分类参与权重求和；分类概率参与最终商品概率计算。改变类别重算原类别与新类别，改变分类概率重算整盒。", "rules": "分类必选。六个概率均须填写、各在0%至100%之间且合计100%，不能把空值当零；当前原型支持0.01%，正式精度待接口统一。没有分类单独上线开关。", "reading": "某分类概率越高，该分类整体越常被抽中；越低则越少。没有哪一类天然应该越高越好。六类合计固定100%，提高一类必须相应降低其他类；从成本较低的类别转向成本较高的类别通常会增加整盒成本。", "action": "用于配置各档奖品的出奖结构。应比较类别内按权重算出的平均进货成本，不能仅凭Common或Grail名称判断成本；改完看全Box成本与毛收益。Category类别本身是标签，没有数值高低评价。", "purpose": "说明每个稀有度分配到多少开盒机会，是SKU概率计算的前提，也能解释分类成本为什么高。"}, {"label": "SKU 数量与 Total items · 记录数量", "kind": "系统计算", "meaning": "帮助运营区分整盒商品数、某分类商品数和搜索结果数。", "source": "只读；统计当前编辑中的SKU配置，包含缺货SKU及尚未保存的新增行，不是库存数量或累计销量。", "calculation": "Prize pool旁数字统计全Box；分类Tab括号统计该分类；Total items统计当前分类搜索后的总记录，分页不改变此总数。", "rules": "增删、改分类、导入或取消编辑后更新。分页展示条数另由20／50／100控制；统计与抽奖概率分母是两回事。", "reading": "高表示配置的SKU种类／记录更多，不表示库存更多、奖池价值更高或盈利更好；低表示种类更少。缺货SKU仍计入数量。", "action": "用于检查配置覆盖和搜索结果。新增有效SKU会分走同类概率，因此SKU数量增加后要看重算结果；不能把SKU种类数当成可抽奖总次数。", "purpose": "让运营确认当前看到的记录范围和配置数量，避免把分页或搜索结果误当整盒数据。"}]}], "simulation-result": [{"title": "本轮输入与模拟范围", "fields": [{"label": "Open price used in this run · 本轮模拟售价", "kind": "系统读取", "meaning": "本轮模拟使用的开盒售价，单位美元／抽，用于解释本轮收益结果。", "source": "点击Run simulation时从当前编辑配置复制为固定快照；弹窗只读。", "calculation": "不重新计算，也不跟随后续售价编辑变化；本轮模拟成本和毛收益都关联同一快照。", "rules": "运行前售价必须有效。修改售价后旧结果标记过期，不用新售价解释旧结果。", "reading": "同一轮成本固定时，这个售价越高，本轮计算出的毛收益越高。它只是运行时的售价快照，不是当前售价实时值，也不代表实际实收。", "action": "用于解释本轮模拟 ng": "原始表格为特定Box和分类列出的商品市场价区间，单位美元，包含上下限；不是进货价范围，也不是开盒售价。", "source": "只读；四个已有Box按Box ID与所选Category读取对应原表资料。选择／切换分类立即更新，编辑已有SKU按当前分类显示。", "calculation": "不从SKU价格或实时行情计算，也不根据当前开盒售价临时套档。没有分类或没有该Box范围资料时不显示；新增同价Box也不自动继承。", "rules": "仅提供录入参考，不自动填价格、不改变分类／权重／概率，超区间时标红；提交时二次确认，可选择继续编辑或仍然应用，不作为硬性拦截。金额显示两位小数。生产需保存Box与来源范围配置的关联；四档示例来自原表。", "reading": "较高区间表示该类奖品的市场参考价档位较高，不代表进货成本或利润更高。区间本身不是优劣评分。", "action": "录入Market price时对照该区间核对奖品分类；显示含上下限。当前需求只展示，不自动阻止范围外输入。新Box没有资料时不猜范围；已有Box改名或改售价不自动切换来源档位。", "purpose": "让运营在选择分类后立即知道该Box预期放什么市场价档位的奖品，减少来回查表和不同Box档位混淆。"}, {"label": "SKU ID · 商品配置编号", "kind": "系统生成", "meaning": "标识当前 Box 中的 SKU 配置，用于编辑、导入匹配及关联库存和抽奖历史。", "source": "首次成功保存草稿或发布时生成稳定 ID，运营不可填写或修改；保存前显示 Assigned on save。", "calculation": "不从商品名称计算；后端生成并保证唯一性，具体编码规则待接口约定。同一商品加入其他 Box 后配置与库存独立。", "rules": "导入空 ID 表示新增；非空 ID 只能匹配当前 Box 中已有 SKU。重复、未知或跨 Box 的 ID 拒绝；移除配置不删除历史关联。", "purpose": "为编辑、导入更新和历史记录提供稳定匹配依据；名称可变，不能承担这个职责。"}, {"label": "Product image URL · 商品图片链接", "kind": "运营填写", "meaning": "新增和编辑SKU仅输入图片URL，不提供本地图片上传。", "source": "先点击Upload image to get URL前往外部网站上传，复制图片直链回填；网站待确定，按钮暂禁用，已有直链可填写。", "calculation": "填写HTTPS图片直链，提交时校验并读取图片；成功后与SKU关联，原型缓存可用图片。", "rules": "必填；空值、非HTTPS或不可读取图片不得提交。加载失败保留其他输入，不回退到上传文件。原演示SKU缺少URL时编辑需补填；Box媒体输入规则见Box media章节。", "purpose": "让运营从商品包装确认款式，并为用户展示奖品；图片处理成功不替代商品身份核对。"}]}, {"title": "价格、权重与库存", "fields": [{"label": "Market price · 市场价", "kind": "运营填写", "meaning": "该商品用于运营对比的市场参考价，单位美元／件。不是平台实际采购成本。", "source": "在 SKU 新增／编辑弹窗或导入文件中填写；列表只读，不自动抓取实时行情。", "calculation": "本字段不计算；修改后重算 Purchase / Market。它不直接改变权重、抽中概率或理论每抽成本。", "rules": "必填、大于零且为有限数值；界面显示两位小数。新增／编辑表单超分类建议范围时标红，提交需二次确认，确认后允许应用；市场价>100美元且库存>50时额外黄字提醒。应用到当前编辑后需保存或发布。正式金额输入与存储精度需接口统一，不能只靠前端显示约束。", "reading": "高表示商品的市场参考价值较高，低表示较低；没有统一的越高越好。市场价不等于平台收入，也不直接进入采购成本计算。", "action": "用于核对奖品定位和进货价是否合理。先确认同款、同版本与同成色的参考价；不能通过抬高市场价让奖池看起来更赚钱。", "purpose": "给奖品的市场参考价值提供背景，并作为采购比的分母；不能单独证明平台盈利。"}, {"label": "Purchase cost · 进货价", "kind": "运营填写", "meaning": "平台获得一件该商品的采购成本，单位美元／件；用于奖池成本核算。", "source": "在 SKU 新增／编辑弹窗或导入文件填写；列表只读。", "calculation": "本字段不自动从市场价推算。修改后重算采购比、该商品成本贡献、整盒成本与毛收益，并使旧模拟结果过期。", "rules": "必填、允许零，不允许负数、空值或非有限数值。样例的“市场价85%”只是造数据假设，不是生产默认值或强制规则。", "reading": "同一商品、同等质量与供货条件下，进货价越低越有利于成本；越高，每次抽中它的采购支出越大。不同奖品不能只按进货价高低判断好坏。", "action": "用于核对采购报价。若这个SKU的概率大于零，降低进货价会降低整盒成本；不要把不准确的低价填入系统来消除亏损提醒。", "purpose": "说明真实采购支出的输入来源；不展示这个值，就难以判断成本贡献高是采购价高还是概率高。"}, {"label": "Purchase / Market · 进货价占市场价比例", "kind": "系统计算", "meaning": "采购成本占市场参考价的百分比，用于比较采购价格，不是毛利率。", "source": "只读；输入来自当前编辑中的 Purchase cost 与 Market price，不能直接填写。", "calculation": "用进货价除以市场价，再转成百分比。例如进货价4美元、市场价5美元，显示80.00%。两项价格变化时立即重算。", "rules": "通常显示两位百分数。价格缺失或非法时显示—；市场价为零不能相除。超过100%允许显示，不自动改权重；导入计算列不采信上传值。", "reading": "市场参考价可信且比较口径相同时，比例越低，采购成本占市场价越少，通常采购空间更大；越高，空间越小。超过100%表示采购价高于填入的市场参考价，不等于整盒必亏。", "action": "用于检查采购性价比和价格录入。比如80%表示市场价每1美元对应采购支出0.80美元，剩下的20%不是开盒毛利率。最终盈利仍看整盒成本与开盒售价。", "purpose": "把不同参考价商品的采购成本转成统一比例，帮助发现报价／录入异常；不是另一种利润指标。"}, {"label": "Weight · 类内权重", "kind": "运营填写", "meaning": "同一分类内商品的相对中奖机会。它不是百分比，也不是库存件数。", "source": "新增／编辑SKU、导入或表格行内填写；允许正小数，无需凑成100。新SKU权重为空，必须填写。", "calculation": "先把同一分类中所有有库存且配置合法商品的权重相加，再用各商品权重计算类内占比。权重输入合法时立即重算概率、成本和收益，旧模拟过期。", "rules": "必须是大于零的有限数值。空值或非法值不按零处理；标错、计算结果显示—，保存／发布校验不通过。行内修改只属于未保存编辑，不立即改变线上权重。", "reading": "同分类其他有效权重不变时，提高本SKU权重会提高其抽中概率（只有它可抽时概率不变），同时压低同类其他SKU的概率。没有越高或越低越好的标准；不同分类的权重不能直接比较。", "action": "用于调节同类奖品的出奖结构。提高比该类当前平均采购成本更便宜商品的权重，会降低该类期望成本；提高更贵商品的权重则会增加成本。修改后看整盒重算结果。同类权重全乘相同倍数，概率不变。", "purpose": "给运营一个可编辑的同类出奖频率控制项；无需手工凑各SKU概率为100%。"}, {"label": "Stock remaining / Available stock / Initial stock · 剩余可抽／初始库存", "kind": "系统读取／新增可填", "meaning": "当前 Box 分配给该 SKU、可用于抽奖的件数，非负整数。", "source": "新增时 Initial stock 默认10,000，可手动修改；已保存 SKU 的 Available stock 来自独立库存台账，在列表独立的Stock remaining列显示，编辑弹窗仍用Available stock且只读。", "calculation": "已有库存用 Adjust stock 调整：Add加上输入数量，Remove减去输入数量；真实完成抽奖由库存服务扣减。库存为零时退出计算，补货后按原权重恢复。", "rules": "新增／编辑SKU中，市场价>100美元且库存>50时额外显示黄色风险文字，提醒复核采购成本与抽中概率，不阻止提交；100美元或50件的边界不触发。已有库存调整确认后立即生效，不等待发布，也不随取消配置或修改配置回滚。导入只接受新SKU的初始库存；现有库存不回写。并发扣减、防重和锁由后端实现。", "reading": "高表示可分配出奖件数更多，低表示更接近缺货，不代表概率更高或利润更好。当前库存数量不参与权重加权；从120变150不会改变概率，从正数变零才会退出抽取。", "action": "用于补货和核对可履约数量，不能为了好看虚填库存。归零或恢复库存会触发同类重分配，之后应重新检查整盒成本；低价商品售罄有可能提高剩余奖池成本。没有新增固定低库存报警阈值。 页面分为剩余可抽和累计抽出两列，库存台账与抽奖计数各自独立。剩余可抽加累计抽出不代表初始库存，补货和人工减少都会使两者不同。", "purpose": "解释哪些SKU当前能够被抽到，也帮助识别库存归零导致的概率及成本变化。"}, {"label": "Stock alert · 库存告警开关", "kind": "运营填写", "meaning": "是否为当前Box的当前SKU启用按剩余数量判断的库存告警。", "source": "新增默认Off；旧数据无字段按Off处理，编辑读取stockAlertEnabled。", "calculation": "Off不判断告警且隐藏阈值；On显示必填阈值，不预填任何数字。", "rules": "Apply changes仅应用当前编辑；Save draft保存草稿；Publish后成为已发布规则。取消弹窗不修改配置。关闭并应用时清空已保存阈值，不影响库存、概率、收益或模拟。", "purpose": "让运营按需为单个奖品启用告警，避免默认全量开启。"}, {"label": "Alert threshold (units) · 库存告警阈值", "kind": "运营填写", "meaning": "剩余可抽库存达到此数量或更少时提示，单位件；不是百分比或累计抽出数量。", "source": "仅On时必填stockAlertThreshold；由运营输入，无默认值。", "calculation": "启用且Stock remaining≤阈值时显示Low stock；补货至大于阈值后清除。0合法，表示库存耗尽时告警；阈值可高于当前库存，应用后立即显示当前配置预览。", "rules": "必须为0至9,007,199,254,740,991的整数；空值、小数、负数、非数值不通过。无效时禁用提交，非法非空输入显示Enter a whole number of 0 or more for the stock alert threshold. 保存／发布再次校验。", "purpose": "用明确剩余件数提醒补货，阈值由运营按奖品单独决定。"}]}], "stock-alert": [{"title": "告警配置", "fields": [{"label": "Stock remaining / Available stock / Initial stock · 剩余可抽／初始库存", "kind": "系统读取／新增可填", "meaning": "当前 Box 分配给该 SKU、可用于抽奖的件数，非负整数。", "source": "新增时 Initial stock 默认10,000，可手动修改；已保存 SKU 的 Available stock 来自独立库存台账，在列表独立的Stock remaining列显示，编辑弹窗仍用Available stock且只读。", "calculation": "已有库存用 Adjust stock 调整：Add加上输入数量，Remove减去输入数量；真实完成抽奖由库存服务扣减。库存为零时退出计算，补货后按原权重恢复。", "rules": "新增／编辑SKU中，市场价>100美元且库存>50时额外显示黄色风险文字，提醒复核采购成本与抽中概率，不阻止提交；100美元或50件的边界不触发。已有库存调整确认后立即生效，不等待发布，也不随取消配置或修改配置回滚。导入只接受新SKU的初始库存；现有库存不回写。并发扣减、防重和锁由后端实现。", "reading": "高表示可分配出奖件数更多，低表示更接近缺货，不代表概率更高或利润更好。当前库存数量不参与权重加权；从120变150不会改变概率，从正数变零才会退出抽取。", "action": "用于补货和核对可履约数量，不能为了好看虚填库存。归零或恢复库存会触发同类重分配，之后应重新检查整盒成本；低价商品售罄有可能提高剩余奖池成本。没有新增固定低库存报警阈值。 页面分为剩余可抽和累计抽出两列，库存台账与抽奖计数各自独立。剩余可抽加累计抽出不代表初始库存，补货和人工减少都会使两者不同。", "purpose": "解释哪些SKU当前能够被抽到，也帮助识别库存归零导致
